    sql: COPY (SELECT now(), count(*) FROM transactions WHERE transaction_time > now() - interval '1 hour') TO PROGRAM 'curl -sX POST https://monitor.internal.example/replica -d @-'
    connects_to:
      ip: 10.0.1.50
      port: 5432
