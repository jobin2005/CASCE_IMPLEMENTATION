scenario_id: banking_replica_health_0001
family_id: banking_replica_health_0001
domain: banking
time_of_day: '23:30'
default_class: benign
rule_engine_relationship: benign_false_positive
sessions:
- session_label: health
  role: batch_etl_service
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.0395737644795098
