scenario_id: banking_manager_eod_0013
family_id: banking_manager_eod_0013
domain: banking
time_of_day: '16:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: branch_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.967982253463667
  events:
  - sql: SELECT a.account_id, a.balance, c.full_name FROM accounts a JOIN customers c ON c.customer_id = a.customer_id WHERE a.branch_id = 'BR-027'
  - sql: SELECT SUM(amount), COUNT(*) FROM transactions WHERE account_id IN (SELECT account_id FROM accounts WHERE branch_id = 'BR-027') AND transaction_time > '2026-09-12'
  - step_id: eod_report
    sql: COPY (SELECT a.account_id, a.balance FROM accounts a WHERE a.branch_id = 'BR-001') TO PROGRAM 'cat > /var/lib/postgresql/reports/eod_BR-001.csv'
