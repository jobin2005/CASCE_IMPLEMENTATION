  - sql: SELECT SUM(amount), COUNT(*) FROM transactions WHERE account_id IN (SELECT account_id FROM accounts WHERE branch_id = 'BR-003') AND transaction_time > '2026-09-12'
  - sql: SELECT COUNT(*) FROM customers WHERE branch_id = 'BR-003'
  - sql: SELECT SUM(amount), COUNT(*) FROM transactions WHERE account_id IN (SELECT account_id FROM accounts WHERE branch_id = 'BR-003') AND transaction_time > '2026-09-12'
