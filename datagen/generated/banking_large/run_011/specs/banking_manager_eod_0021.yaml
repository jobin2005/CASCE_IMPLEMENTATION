scenario_id: banking_manager_eod_0021
family_id: banking_manager_eod_0021
domain: banking
time_of_day: '16:30'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: branch_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 4.33690895753978
  events:
  - sql: SELECT DATE(t.transaction_time), SUM(t.amount) FROM transactions t JOIN accounts a ON a.account_id = t.account_id WHERE a.branch_id = 'BR-014' AND t.transaction_time > NOW() - INTERVAL '30 days'
      GROUP BY DATE(t.transaction_time)
  - sql: SELECT a.account_id, a.balance, c.full_name FROM accounts a JOIN customers c ON c.customer_id = a.customer_id WHERE a.branch_id = 'BR-014'
  - step_id: eod_report
    sql: COPY (SELECT a.account_id, a.balance FROM accounts a WHERE a.branch_id = 'BR-005') TO PROGRAM 'cat > /var/lib/postgresql/reports/eod_BR-005.csv'
