scenario_id: banking_manager_eod_0002
family_id: banking_manager_eod_0002
domain: banking
time_of_day: '16:30'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: branch_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.310505631811175
  events:
  - sql: SELECT c.full_name, a.balance FROM customers c JOIN accounts a ON a.customer_id = c.customer_id WHERE a.branch_id = 'BR-014' AND a.balance > 52143 ORDER BY a.balance DESC
  - sql: SELECT a.account_type, COUNT(*), SUM(a.balance) FROM accounts a WHERE a.branch_id = 'BR-014' GROUP BY a.account_type
  - sql: SELECT c.full_name, a.balance FROM customers c JOIN accounts a ON a.customer_id = c.customer_id WHERE a.branch_id = 'BR-014' AND a.balance > 52143 ORDER BY a.balance DESC
  - sql: SELECT SUM(amount), COUNT(*) FROM transactions WHERE account_id IN (SELECT account_id FROM accounts WHERE branch_id = 'BR-014') AND transaction_time > '2026-09-12'
  - step_id: eod_report
    sql: COPY (SELECT a.account_id, a.balance FROM accounts a WHERE a.branch_id = 'BR-022') TO PROGRAM 'cat > /var/lib/postgresql/reports/eod_BR-022.csv'
