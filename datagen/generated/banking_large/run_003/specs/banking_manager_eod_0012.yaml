scenario_id: banking_manager_eod_0012
family_id: banking_manager_eod_0012
domain: banking
time_of_day: '17:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: branch_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 4.327080619094652
  events:
  - sql: SELECT SUM(amount), COUNT(*) FROM transactions WHERE account_id IN (SELECT account_id FROM accounts WHERE branch_id = 'BR-027') AND transaction_time > '2026-09-12'
  - sql: SELECT a.account_id, a.balance, c.full_name FROM accounts a JOIN customers c ON c.customer_id = a.customer_id WHERE a.branch_id = 'BR-027'
  - sql: SELECT c.full_name, a.balance FROM customers c JOIN accounts a ON a.customer_id = c.customer_id WHERE a.branch_id = 'BR-027' AND a.balance > 21164 ORDER BY a.balance DESC
  - sql: SELECT c.customer_id, c.full_name, COUNT(t.transaction_id) as txn_count FROM customers c JOIN accounts a ON a.customer_id = c.customer_id JOIN transactions t ON t.account_id = a.account_id WHERE
      a.branch_id = 'BR-027' GROUP BY c.customer_id, c.full_name ORDER BY txn_count DESC LIMIT 20
  - step_id: eod_report
    sql: COPY (SELECT a.account_id, a.balance FROM accounts a WHERE a.branch_id = 'BR-042') TO PROGRAM 'cat > /var/lib/postgresql/reports/eod_BR-042.csv'
