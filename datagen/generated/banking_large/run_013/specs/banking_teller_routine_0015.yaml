scenario_id: banking_teller_routine_0015
family_id: banking_teller_routine_0015
domain: banking
time_of_day: '10:45'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: teller_work
  role: teller
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 1.932197432016236
  events:
  - sql: SELECT c.full_name, c.customer_id, a.account_type FROM customers c JOIN accounts a ON a.customer_id = c.customer_id WHERE c.branch_id = 'BR-063' AND c.customer_id = 9467
  - sql: SELECT t.transaction_id, t.amount, t.counterparty FROM transactions t WHERE t.account_id = 84870 AND t.transaction_time > '2026-09-01' ORDER BY t.transaction_time DESC
