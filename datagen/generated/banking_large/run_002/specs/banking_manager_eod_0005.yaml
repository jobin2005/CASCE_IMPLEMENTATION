scenario_id: banking_manager_eod_0005
family_id: banking_manager_eod_0005
domain: banking
time_of_day: '17:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: branch_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.325207641644133
  events:
  - sql: SELECT COUNT(*) FROM customers WHERE branch_id = 'BR-001'
  - sql: SELECT SUM(amount), COUNT(*) FROM transactions WHERE account_id IN (SELECT account_id FROM accounts WHERE branch_id = 'BR-001') AND transaction_time > '2026-09-12'
  - sql: SELECT c.full_name, a.balance FROM customers c JOIN accounts a ON a.customer_id = c.customer_id WHERE a.branch_id = 'BR-001' AND a.balance > 25118 ORDER BY a.balance DESC
  - step_id: eod_report
    sql: COPY (SELECT a.account_id, a.balance FROM accounts a WHERE a.branch_id = 'BR-019') TO PROGRAM 'cat > /var/lib/postgresql/reports/eod_BR-019.csv'
