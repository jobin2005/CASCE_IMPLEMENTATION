scenario_id: gen_banking_35_union_report_ben_882
family_id: gen_banking_35_union_report_ben_fam882
domain: banking
time_of_day: '12:10'
default_class: benign
rule_engine_relationship: benign_false_positive
sessions:
- session_label: reporting
  role: branch_manager
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 5.0
  events:
  - step_id: report
    sql: SELECT transaction_id, amount FROM transactions WHERE branch_id = 'BR-014'
      UNION SELECT transaction_id, amount FROM transactions WHERE branch_id = 'BR-052'
  - step_id: gen
    process:
      comm: bash
      args:
      - report_gen
      parent: report
  - file:
      path: /var/reports/banking_559006.csv
      syscall: openat
      parent: gen
