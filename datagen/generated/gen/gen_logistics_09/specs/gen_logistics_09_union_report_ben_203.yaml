scenario_id: gen_logistics_09_union_report_ben_203
family_id: gen_logistics_09_union_report_ben_fam203
domain: logistics
time_of_day: '17:40'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: reporting
  role: fleet_manager
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.0
  events:
  - step_id: report
    sql: SELECT vehicle_id, plate_number FROM vehicles WHERE depot_id = 'DP-02' UNION
      SELECT vehicle_id, plate_number FROM vehicles WHERE depot_id = 'DP-11'
  - step_id: gen
    process:
      comm: bash
      args:
      - report_gen
      parent: report
  - file:
      path: /var/reports/logistics_608346.csv
      syscall: openat
      parent: gen
