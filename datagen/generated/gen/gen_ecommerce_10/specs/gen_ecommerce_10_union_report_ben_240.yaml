scenario_id: gen_ecommerce_10_union_report_ben_240
family_id: gen_ecommerce_10_union_report_ben_fam240
domain: ecommerce
time_of_day: '10:40'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: reporting
  role: payments_service
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 8.0
  events:
  - step_id: report
    sql: SELECT product_id, name FROM products WHERE status = 'flagged' UNION SELECT
      product_id, name FROM products WHERE status = 'pending'
  - step_id: gen
    process:
      comm: bash
      args:
      - report_gen
      parent: report
  - file:
      path: /var/reports/ecommerce_24073.csv
      syscall: openat
      parent: gen
