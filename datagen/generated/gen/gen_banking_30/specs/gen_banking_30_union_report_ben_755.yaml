scenario_id: gen_banking_30_union_report_ben_755
family_id: gen_banking_30_union_report_ben_fam755
domain: banking
time_of_day: '15:40'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: reporting
  role: branch_manager
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 5.0
  events:
  - step_id: report
    sql: SELECT account_id, account_type FROM accounts WHERE branch_id = 'BR-011'
      UNION SELECT account_id, account_type FROM accounts WHERE branch_id = 'BR-014'
  - step_id: gen
    process:
      comm: python3
      args:
      - report_gen
      parent: report
  - file:
      path: /var/reports/banking_196875.csv
      syscall: openat
      parent: gen
