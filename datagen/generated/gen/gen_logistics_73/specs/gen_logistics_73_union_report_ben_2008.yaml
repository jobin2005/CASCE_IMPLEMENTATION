scenario_id: gen_logistics_73_union_report_ben_2008
family_id: gen_logistics_73_union_report_ben_fam2008
domain: logistics
time_of_day: '13:10'
default_class: benign
rule_engine_relationship: benign_false_positive
sessions:
- session_label: reporting
  role: fleet_manager
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 8.0
  events:
  - step_id: report
    sql: SELECT vehicle_id, plate_number FROM vehicles WHERE depot_id = 'DP-11' UNION
      SELECT vehicle_id, plate_number FROM vehicles WHERE depot_id = 'DP-05'
  - step_id: gen
    process:
      comm: bash
      args:
      - report_gen
      parent: report
  - file:
      path: /var/reports/logistics_405174.csv
      syscall: openat
      parent: gen
