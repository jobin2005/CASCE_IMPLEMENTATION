scenario_id: gen_banking_36_union_report_ben_902
family_id: gen_banking_36_union_report_ben_fam902
domain: banking
time_of_day: '16:40'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: reporting
  role: teller
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
