scenario_id: logistics_dispatcher_routine_0025
family_id: logistics_dispatcher_routine_0025
domain: logistics
time_of_day: '10:30'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: dispatcher_work
  role: dispatcher
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 1.9556643265247937
  events:
  - sql: SELECT d.full_name, d.phone FROM drivers d WHERE d.depot_id = 'DEPOT-HAZMAT' AND d.driver_id = 4839
  - sql: SELECT d.full_name, d.phone FROM drivers d WHERE d.depot_id = 'DEPOT-HAZMAT' AND d.driver_id = 4839
  - sql: UPDATE shipments SET status = 'dispatched', driver_id = 2073 WHERE shipment_id = 76899
  - sql: SELECT s.shipment_id, s.status, s.dest_address, d.full_name FROM shipments s JOIN drivers d ON d.driver_id = s.driver_id WHERE d.depot_id = 'DEPOT-HAZMAT' AND s.status = 'pending' ORDER BY s.dispatched_at
  - step_id: daily_report
    sql: COPY (SELECT s.shipment_id, s.status, s.dest_address FROM shipments s JOIN drivers d ON d.driver_id = s.driver_id WHERE d.depot_id = 'DEPOT-AIR' AND s.dispatched_at > NOW() - INTERVAL '1 day')
      TO PROGRAM 'cat > /var/lib/postgresql/reports/depot_DEPOT-AIR_daily.csv'
