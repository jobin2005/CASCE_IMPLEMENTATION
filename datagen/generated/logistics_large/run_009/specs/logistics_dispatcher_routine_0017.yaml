scenario_id: logistics_dispatcher_routine_0017
family_id: logistics_dispatcher_routine_0017
domain: logistics
time_of_day: 09:15
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: dispatcher_work
  role: dispatcher
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 1.637180136430258
  events:
  - sql: UPDATE shipments SET status = 'delivered' WHERE shipment_id = 87729
  - sql: UPDATE shipments SET status = 'dispatched', driver_id = 1957 WHERE shipment_id = 89358
  - sql: SELECT v.vehicle_id, v.plate_number, v.capacity_kg FROM vehicles v WHERE v.depot_id = 'DEPOT-SOUTH' AND v.vehicle_id NOT IN (SELECT vehicle_id FROM shipments WHERE status = 'in_transit')
  - step_id: daily_report
    sql: COPY (SELECT s.shipment_id, s.status, s.dest_address FROM shipments s JOIN drivers d ON d.driver_id = s.driver_id WHERE d.depot_id = 'DEPOT-HAZMAT' AND s.dispatched_at > NOW() - INTERVAL '1 day')
      TO PROGRAM 'cat > /var/lib/postgresql/reports/depot_DEPOT-HAZMAT_daily.csv'
