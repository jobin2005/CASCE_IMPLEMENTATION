scenario_id: logistics_dispatcher_routine_1002
family_id: logistics_dispatcher_routine_1002
domain: logistics
time_of_day: '11:30'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: dispatcher_work
  role: dispatcher
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.6061530707110947
  events:
  - sql: UPDATE shipments SET status = 'delivered' WHERE shipment_id = 78698
  - sql: SELECT s.shipment_id, s.dispatched_at, v.plate_number FROM shipments s JOIN vehicles v ON v.vehicle_id = s.vehicle_id WHERE s.driver_id = 2055 AND s.status = 'in_transit'
  - step_id: daily_report
    sql: COPY (SELECT s.shipment_id, s.status, s.dest_address FROM shipments s JOIN drivers d ON d.driver_id = s.driver_id WHERE d.depot_id = 'DEPOT-HAZMAT' AND s.dispatched_at > NOW() - INTERVAL '1 day')
      TO PROGRAM 'cat > /var/lib/postgresql/reports/depot_DEPOT-HAZMAT_daily.csv'
