scenario_id: logistics_dispatcher_routine_0011
family_id: logistics_dispatcher_routine_0011
domain: logistics
time_of_day: 09:45
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: dispatcher_work
  role: dispatcher
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.1152172727889256
  events:
  - sql: SELECT s.shipment_id, s.status, s.dest_address, d.full_name FROM shipments s JOIN drivers d ON d.driver_id = s.driver_id WHERE d.depot_id = 'DEPOT-AIR' AND s.status = 'pending' ORDER BY s.dispatched_at
  - sql: SELECT d.full_name, d.phone FROM drivers d WHERE d.depot_id = 'DEPOT-AIR' AND d.driver_id = 3431
  - sql: SELECT COUNT(*) FROM shipments WHERE origin_warehouse_id IN (SELECT warehouse_id FROM warehouses WHERE manager_id IN (SELECT driver_id FROM drivers WHERE depot_id = 'DEPOT-AIR')) AND status = 'pending'
  - sql: SELECT d.full_name, d.phone FROM drivers d WHERE d.depot_id = 'DEPOT-AIR' AND d.driver_id = 3431
  - step_id: daily_report
    sql: COPY (SELECT s.shipment_id, s.status, s.dest_address FROM shipments s JOIN drivers d ON d.driver_id = s.driver_id WHERE d.depot_id = 'DEPOT-CENTRAL' AND s.dispatched_at > NOW() - INTERVAL '1 day')
      TO PROGRAM 'cat > /var/lib/postgresql/reports/depot_DEPOT-CENTRAL_daily.csv'
