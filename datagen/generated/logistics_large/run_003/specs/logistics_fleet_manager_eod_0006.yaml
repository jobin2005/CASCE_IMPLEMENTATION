scenario_id: logistics_fleet_manager_eod_0006
family_id: logistics_fleet_manager_eod_0006
domain: logistics
time_of_day: '17:30'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: fleet_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.4596163434361955
  events:
  - sql: SELECT d.depot_id, d.full_name, COUNT(s.shipment_id) as shipment_count FROM drivers d JOIN shipments s ON s.driver_id = d.driver_id WHERE d.depot_id IN ('DEPOT-EAST', 'DEPOT-AIR', 'DEPOT-WEST',
      'DEPOT-HUB-1') AND s.dispatched_at > NOW() - INTERVAL '30 days' GROUP BY d.depot_id, d.full_name ORDER BY shipment_count DESC
  - sql: SELECT d.depot_id, d.full_name, COUNT(s.shipment_id) as shipment_count FROM drivers d JOIN shipments s ON s.driver_id = d.driver_id WHERE d.depot_id IN ('DEPOT-EAST', 'DEPOT-AIR', 'DEPOT-WEST',
      'DEPOT-HUB-1') AND s.dispatched_at > NOW() - INTERVAL '30 days' GROUP BY d.depot_id, d.full_name ORDER BY shipment_count DESC
  - sql: SELECT DATE(s.dispatched_at), COUNT(s.shipment_id), SUM(m.weight_kg) FROM shipments s JOIN manifests m ON m.shipment_id = s.shipment_id WHERE s.dispatched_at > NOW() - INTERVAL '30 days' GROUP
      BY DATE(s.dispatched_at) ORDER BY DATE(s.dispatched_at)
  - sql: SELECT v.depot_id, COUNT(*), SUM(v.capacity_kg) FROM vehicles v WHERE v.depot_id IN ('DEPOT-EAST', 'DEPOT-AIR', 'DEPOT-WEST', 'DEPOT-HUB-1') GROUP BY v.depot_id
  - step_id: eod_report
    sql: COPY (SELECT v.vehicle_id, v.plate_number, v.capacity_kg FROM vehicles v WHERE v.depot_id = 'DEPOT-AIR') TO PROGRAM 'cat > /var/lib/postgresql/reports/fleet_DEPOT-AIR_status.csv'
