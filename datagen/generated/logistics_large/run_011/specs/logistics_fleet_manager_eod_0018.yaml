scenario_id: logistics_fleet_manager_eod_0018
family_id: logistics_fleet_manager_eod_0018
domain: logistics
time_of_day: '16:30'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: fleet_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.479876804099691
  events:
  - sql: SELECT v.depot_id, COUNT(*), SUM(v.capacity_kg) FROM vehicles v WHERE v.depot_id IN ('DEPOT-HUB-1', 'DEPOT-SOUTH', 'DEPOT-AIR', 'DEPOT-EAST') GROUP BY v.depot_id
  - sql: SELECT v.depot_id, COUNT(*), SUM(v.capacity_kg) FROM vehicles v WHERE v.depot_id IN ('DEPOT-HUB-1', 'DEPOT-SOUTH', 'DEPOT-AIR', 'DEPOT-EAST') GROUP BY v.depot_id
  - sql: SELECT DATE(s.dispatched_at), COUNT(s.shipment_id), SUM(m.weight_kg) FROM shipments s JOIN manifests m ON m.shipment_id = s.shipment_id WHERE s.dispatched_at > NOW() - INTERVAL '30 days' GROUP
      BY DATE(s.dispatched_at) ORDER BY DATE(s.dispatched_at)
  - step_id: eod_report
    sql: COPY (SELECT v.vehicle_id, v.plate_number, v.capacity_kg FROM vehicles v WHERE v.depot_id = 'DEPOT-COLD') TO PROGRAM 'cat > /var/lib/postgresql/reports/fleet_DEPOT-COLD_status.csv'
