scenario_id: logistics_fleet_manager_eod_1016
family_id: logistics_fleet_manager_eod_1016
domain: logistics
time_of_day: '18:30'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: fleet_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 4.210519089076874
  events:
  - sql: SELECT d.depot_id, d.full_name, COUNT(s.shipment_id) as shipment_count FROM drivers d JOIN shipments s ON s.driver_id = d.driver_id WHERE d.depot_id IN ('DEPOT-CENTRAL', 'DEPOT-PORT', 'DEPOT-RAIL')
      AND s.dispatched_at > NOW() - INTERVAL '30 days' GROUP BY d.depot_id, d.full_name ORDER BY shipment_count DESC
  - sql: SELECT v.depot_id, COUNT(*), SUM(v.capacity_kg) FROM vehicles v WHERE v.depot_id IN ('DEPOT-CENTRAL', 'DEPOT-PORT', 'DEPOT-RAIL') GROUP BY v.depot_id
  - step_id: eod_report
    sql: COPY (SELECT v.vehicle_id, v.plate_number, v.capacity_kg FROM vehicles v WHERE v.depot_id = 'DEPOT-HAZMAT') TO PROGRAM 'cat > /var/lib/postgresql/reports/fleet_DEPOT-HAZMAT_status.csv'
