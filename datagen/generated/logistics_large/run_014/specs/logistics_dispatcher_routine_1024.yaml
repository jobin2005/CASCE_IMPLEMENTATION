scenario_id: logistics_dispatcher_routine_1024
family_id: logistics_dispatcher_routine_1024
domain: logistics
time_of_day: '14:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: dispatcher_work
  role: dispatcher
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.1040569074963495
  events:
  - sql: SELECT d.driver_id, d.full_name, COUNT(s.shipment_id) as active_shipments FROM drivers d LEFT JOIN shipments s ON s.driver_id = d.driver_id AND s.status = 'in_transit' WHERE d.depot_id = 'DEPOT-NORTH'
      GROUP BY d.driver_id, d.full_name
  - sql: SELECT d.driver_id, d.full_name, COUNT(s.shipment_id) as active_shipments FROM drivers d LEFT JOIN shipments s ON s.driver_id = d.driver_id AND s.status = 'in_transit' WHERE d.depot_id = 'DEPOT-NORTH'
      GROUP BY d.driver_id, d.full_name
  - step_id: daily_report
    sql: COPY (SELECT s.shipment_id, s.status, s.dest_address FROM shipments s JOIN drivers d ON d.driver_id = s.driver_id WHERE d.depot_id = 'DEPOT-COLD' AND s.dispatched_at > NOW() - INTERVAL '1 day')
      TO PROGRAM 'cat > /var/lib/postgresql/reports/depot_DEPOT-COLD_daily.csv'
