scenario_id: logistics_dispatcher_routine_0004
family_id: logistics_dispatcher_routine_0004
domain: logistics
time_of_day: '10:45'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: dispatcher_work
  role: dispatcher
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.725297412264551
  events:
  - sql: UPDATE shipments SET status = 'dispatched', driver_id = 2299 WHERE shipment_id = 51775
  - sql: SELECT s.shipment_id, s.dispatched_at, v.plate_number FROM shipments s JOIN vehicles v ON v.vehicle_id = s.vehicle_id WHERE s.driver_id = 1230 AND s.status = 'in_transit'
  - sql: SELECT COUNT(*) FROM shipments WHERE origin_warehouse_id IN (SELECT warehouse_id FROM warehouses WHERE manager_id IN (SELECT driver_id FROM drivers WHERE depot_id = 'DEPOT-CENTRAL')) AND status
      = 'pending'
  - sql: SELECT d.driver_id, d.full_name, COUNT(s.shipment_id) as active_shipments FROM drivers d LEFT JOIN shipments s ON s.driver_id = d.driver_id AND s.status = 'in_transit' WHERE d.depot_id = 'DEPOT-CENTRAL'
      GROUP BY d.driver_id, d.full_name
  - sql: SELECT v.vehicle_id, v.plate_number, v.capacity_kg FROM vehicles v WHERE v.depot_id = 'DEPOT-CENTRAL' AND v.vehicle_id NOT IN (SELECT vehicle_id FROM shipments WHERE status = 'in_transit')
  - step_id: daily_report
    sql: COPY (SELECT s.shipment_id, s.status, s.dest_address FROM shipments s JOIN drivers d ON d.driver_id = s.driver_id WHERE d.depot_id = 'DEPOT-NORTH' AND s.dispatched_at > NOW() - INTERVAL '1 day')
      TO PROGRAM 'cat > /var/lib/postgresql/reports/depot_DEPOT-NORTH_daily.csv'
