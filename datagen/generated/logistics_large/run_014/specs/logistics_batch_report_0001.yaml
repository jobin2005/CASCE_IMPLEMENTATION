scenario_id: logistics_batch_report_0001
family_id: logistics_batch_report_0001
domain: logistics
time_of_day: 06:00
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: batch_report
  role: partner_etl_service
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 7.245273056940371
  events:
  - sql: SELECT v.depot_id, COUNT(s.shipment_id), SUM(m.weight_kg) FROM vehicles v JOIN shipments s ON s.vehicle_id = v.vehicle_id JOIN manifests m ON m.shipment_id = s.shipment_id WHERE v.depot_id = 'DEPOT-WEST'
      AND s.dispatched_at > '2026-02-26 00:00:00' GROUP BY v.depot_id
  - sql: SELECT COUNT(s.shipment_id), SUM(m.declared_value) FROM shipments s JOIN manifests m ON m.shipment_id = s.shipment_id WHERE s.dispatched_at > '2026-02-26 00:00:00' AND s.dispatched_at <= '2026-02-27
      00:00:00' AND s.status = 'delivered'
  - step_id: report_send
    sql: COPY (SELECT v.depot_id, COUNT(s.shipment_id), SUM(m.weight_kg) FROM vehicles v JOIN shipments s ON s.vehicle_id = v.vehicle_id JOIN manifests m ON m.shipment_id = s.shipment_id WHERE v.depot_id
      = 'DEPOT-WEST' GROUP BY v.depot_id) TO PROGRAM 'curl -sX POST https://reporting.internal.example/daily -d @-'
    connects_to:
      ip: 172.16.0.50
      port: 9200
