scenario_id: logistics_fleet_manager_eod_0021
family_id: logistics_fleet_manager_eod_0021
domain: logistics
time_of_day: '16:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: fleet_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.2653449292322376
  events:
  - sql: SELECT s.origin_warehouse_id, COUNT(*), AVG(m.weight_kg) FROM shipments s JOIN manifests m ON m.shipment_id = s.shipment_id WHERE s.status = 'delivered' AND s.dispatched_at > NOW() - INTERVAL '30
      days' GROUP BY s.origin_warehouse_id
  - sql: SELECT d.depot_id, d.full_name, COUNT(s.shipment_id) as shipment_count FROM drivers d JOIN shipments s ON s.driver_id = d.driver_id WHERE d.depot_id IN ('DEPOT-AIR', 'DEPOT-CENTRAL') AND s.dispatched_at
      > NOW() - INTERVAL '30 days' GROUP BY d.depot_id, d.full_name ORDER BY shipment_count DESC
  - sql: SELECT d.depot_id, d.full_name, COUNT(s.shipment_id) as shipment_count FROM drivers d JOIN shipments s ON s.driver_id = d.driver_id WHERE d.depot_id IN ('DEPOT-AIR', 'DEPOT-CENTRAL') AND s.dispatched_at
      > NOW() - INTERVAL '30 days' GROUP BY d.depot_id, d.full_name ORDER BY shipment_count DESC
  - sql: SELECT d.depot_id, d.full_name, COUNT(s.shipment_id) as shipment_count FROM drivers d JOIN shipments s ON s.driver_id = d.driver_id WHERE d.depot_id IN ('DEPOT-AIR', 'DEPOT-CENTRAL') AND s.dispatched_at
      > NOW() - INTERVAL '30 days' GROUP BY d.depot_id, d.full_name ORDER BY shipment_count DESC
  - step_id: eod_report
    sql: COPY (SELECT v.vehicle_id, v.plate_number, v.capacity_kg FROM vehicles v WHERE v.depot_id = 'DEPOT-RAIL') TO PROGRAM 'cat > /var/lib/postgresql/reports/fleet_DEPOT-RAIL_status.csv'
