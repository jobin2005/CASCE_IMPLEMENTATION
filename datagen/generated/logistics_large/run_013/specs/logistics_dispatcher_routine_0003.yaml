scenario_id: logistics_dispatcher_routine_0003
family_id: logistics_dispatcher_routine_0003
domain: logistics
time_of_day: '10:15'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: dispatcher_work
  role: dispatcher
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.9316030471243915
  events:
  - sql: SELECT d.full_name, d.phone FROM drivers d WHERE d.depot_id = 'DEPOT-RAIL' AND d.driver_id = 4136
  - sql: UPDATE shipments SET status = 'delivered' WHERE shipment_id = 78052
  - sql: UPDATE shipments SET status = 'dispatched', driver_id = 2302 WHERE shipment_id = 67223
  - sql: UPDATE shipments SET status = 'delivered' WHERE shipment_id = 78052
  - step_id: daily_report
    sql: COPY (SELECT s.shipment_id, s.status, s.dest_address FROM shipments s JOIN drivers d ON d.driver_id = s.driver_id WHERE d.depot_id = 'DEPOT-HUB-1' AND s.dispatched_at > NOW() - INTERVAL '1 day')
      TO PROGRAM 'cat > /var/lib/postgresql/reports/depot_DEPOT-HUB-1_daily.csv'
