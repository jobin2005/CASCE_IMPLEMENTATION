scenario_id: logistics_dispatcher_routine_1011
family_id: logistics_dispatcher_routine_1011
domain: logistics
time_of_day: '10:30'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: dispatcher_work
  role: dispatcher
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 1.805601940451089
  events:
  - sql: UPDATE shipments SET status = 'dispatched', driver_id = 3682 WHERE shipment_id = 70709
  - sql: SELECT d.driver_id, d.full_name, COUNT(s.shipment_id) as active_shipments FROM drivers d LEFT JOIN shipments s ON s.driver_id = d.driver_id AND s.status = 'in_transit' WHERE d.depot_id = 'DEPOT-CENTRAL'
      GROUP BY d.driver_id, d.full_name
  - sql: SELECT s.shipment_id, s.dispatched_at, v.plate_number FROM shipments s JOIN vehicles v ON v.vehicle_id = s.vehicle_id WHERE s.driver_id = 2185 AND s.status = 'in_transit'
  - sql: SELECT s.shipment_id, s.dispatched_at, v.plate_number FROM shipments s JOIN vehicles v ON v.vehicle_id = s.vehicle_id WHERE s.driver_id = 2185 AND s.status = 'in_transit'
  - step_id: daily_report
    sql: COPY (SELECT s.shipment_id, s.status, s.dest_address FROM shipments s JOIN drivers d ON d.driver_id = s.driver_id WHERE d.depot_id = 'DEPOT-SOUTH' AND s.dispatched_at > NOW() - INTERVAL '1 day')
      TO PROGRAM 'cat > /var/lib/postgresql/reports/depot_DEPOT-SOUTH_daily.csv'
