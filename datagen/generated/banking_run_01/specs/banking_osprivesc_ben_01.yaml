scenario_id: banking_osprivesc_ben_01
family_id: banking_os_priv_escalation
domain: banking
matched_pair_id: banking_osprivesc_pair_01
matched_dimensions:
  fixed: [syscall_sequence, timing_pattern, role]
  varied: [process_tree_shape]
time_of_day: "03:10"
default_class: benign
rule_engine_relationship: benign_false_positive
sessions:
  - session_label: escalate
    role: postgres
    anchor: synthetic
    anchor_query: "SELECT 1"
    timing:
      tempo: bursty
      step_gaps_seconds: [1.0]
    events:
      - step_id: copy_script
        process: {comm: cp, args: ["/usr/local/bin/pg_maintenance.sh", "/tmp/pg_maintenance.sh"]}
      - step_id: set_exec
        process: {comm: chmod, args: ["u+x", "/tmp/pg_maintenance.sh"], parent: copy_script}
      - step_id: run_maint
        process: {comm: /tmp/pg_maintenance.sh, args: ["--vacuum-analyze"], parent: set_exec}
