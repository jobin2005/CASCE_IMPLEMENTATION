scenario_id: healthcare_nurse_routine_0008
family_id: healthcare_nurse_routine_0008
domain: healthcare
time_of_day: '14:45'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: nurse_work
  role: nurse
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.6443992609714817
  events:
  - sql: SELECT patient_id, full_name, phone FROM patients WHERE primary_doctor_id IN (SELECT doctor_id FROM doctors WHERE department_id = 'DEPT-PEDS') AND patient_id = 34004
  - sql: SELECT COUNT(*) FROM appointments WHERE doctor_id = 353 AND status = 'scheduled' AND appointment_time > NOW()
  - step_id: daily_report
    sql: COPY (SELECT a.appointment_id, a.patient_id, a.status FROM appointments a WHERE a.doctor_id IN (SELECT doctor_id FROM doctors WHERE department_id = 'DEPT-ORTHO') AND a.appointment_time > NOW()
      - INTERVAL '1 day') TO PROGRAM 'cat > /var/lib/postgresql/reports/dept_DEPT-ORTHO_daily.csv'
