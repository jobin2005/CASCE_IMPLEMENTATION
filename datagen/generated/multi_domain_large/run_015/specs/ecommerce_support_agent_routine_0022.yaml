sessions:
- session_label: support_agent_work
  role: support_agent
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 1.8980560447861472
  events:
  - sql: SELECT oi.product_id, p.name, oi.quantity, oi.unit_price FROM order_items oi JOIN products p ON p.product_id = oi.product_id WHERE oi.order_id = 96455
