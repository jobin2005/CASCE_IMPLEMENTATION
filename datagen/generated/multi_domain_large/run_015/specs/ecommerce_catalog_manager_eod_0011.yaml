rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: catalog_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.5519781683561495
  events:
  - sql: UPDATE products SET price = 285.99 WHERE product_id = 9970
  - sql: SELECT category, COUNT(*), AVG(price) FROM products GROUP BY category ORDER BY COUNT(*) DESC
  - sql: SELECT product_id, name, stock_qty FROM products WHERE stock_qty < 11 AND category = 'Beauty'
