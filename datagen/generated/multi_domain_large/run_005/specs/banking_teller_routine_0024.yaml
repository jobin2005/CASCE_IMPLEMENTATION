scenario_id: banking_teller_routine_0024
family_id: banking_teller_routine_0024
domain: banking
time_of_day: '12:30'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: teller_work
  role: teller
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.0125145851751607
  events:
  - sql: SELECT t.transaction_id, t.amount, t.counterparty FROM transactions t WHERE t.account_id = 82655 AND t.transaction_time > '2026-09-01' ORDER BY t.transaction_time DESC
  - sql: SELECT c.full_name, c.customer_id, a.account_type FROM customers c JOIN accounts a ON a.customer_id = c.customer_id WHERE c.branch_id = 'BR-042' AND c.customer_id = 1672
  - step_id: daily_report
    sql: COPY (SELECT account_id, balance FROM accounts WHERE branch_id = 'BR-027') TO PROGRAM 'cat > /var/lib/postgresql/reports/branch_BR-027_daily.csv'
