scenario_id: logistics_dispatcher_routine_0013
family_id: logistics_dispatcher_routine_0013
domain: logistics
time_of_day: '15:45'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: dispatcher_work
  role: dispatcher
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 1.6402873478224143
  events:
  - sql: UPDATE shipments SET status = 'dispatched', driver_id = 3314 WHERE shipment_id = 65938
  - sql: SELECT s.shipment_id, s.status, s.dest_address, d.full_name FROM shipments s JOIN drivers d ON d.driver_id = s.driver_id WHERE d.depot_id = 'DEPOT-AIR' AND s.status = 'pending' ORDER BY s.dispatched_at
  - sql: UPDATE shipments SET status = 'dispatched', driver_id = 3314 WHERE shipment_id = 65938
  - sql: SELECT d.full_name, d.phone FROM drivers d WHERE d.depot_id = 'DEPOT-AIR' AND d.driver_id = 2228
  - sql: SELECT d.full_name, d.phone FROM drivers d WHERE d.depot_id = 'DEPOT-AIR' AND d.driver_id = 2228
  - step_id: daily_report
    sql: COPY (SELECT s.shipment_id, s.status, s.dest_address FROM shipments s JOIN drivers d ON d.driver_id = s.driver_id WHERE d.depot_id = 'DEPOT-PORT' AND s.dispatched_at > NOW() - INTERVAL '1 day')
      TO PROGRAM 'cat > /var/lib/postgresql/reports/depot_DEPOT-PORT_daily.csv'
