scenario_id: healthcare_nurse_routine_0008
family_id: healthcare_nurse_routine_0008
domain: healthcare
time_of_day: 09:15
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: nurse_work
  role: nurse
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.7643322992326627
  events:
  - sql: SELECT p.prescription_id, p.drug_name, p.dosage FROM prescriptions p WHERE p.patient_id = 19742 ORDER BY p.issued_at DESC LIMIT 5
  - sql: UPDATE appointments SET status = 'checked_in' WHERE appointment_id = 53849 AND patient_id = 78674
  - sql: SELECT a.appointment_id, a.reason, a.appointment_time FROM appointments a WHERE a.patient_id = 14433 AND a.status = 'scheduled' ORDER BY a.appointment_time
  - step_id: daily_report
    sql: COPY (SELECT a.appointment_id, a.patient_id, a.status FROM appointments a WHERE a.doctor_id IN (SELECT doctor_id FROM doctors WHERE department_id = 'DEPT-PSYCH') AND a.appointment_time > NOW()
      - INTERVAL '1 day') TO PROGRAM 'cat > /var/lib/postgresql/reports/dept_DEPT-PSYCH_daily.csv'
