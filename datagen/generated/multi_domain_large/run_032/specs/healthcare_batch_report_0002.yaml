scenario_id: healthcare_batch_report_0002
family_id: healthcare_batch_report_0002
domain: healthcare
time_of_day: 00:00
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: batch_report
  role: research_etl_service
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.305282334464816
  events:
  - sql: SELECT d.department_id, d.specialty, COUNT(a.appointment_id) FROM doctors d JOIN appointments a ON a.doctor_id = d.doctor_id WHERE d.department_id = 'DEPT-PSYCH' AND a.appointment_time > '2026-11-25
      00:00:00' GROUP BY d.department_id, d.specialty
  - sql: SELECT COUNT(m.record_id), COUNT(DISTINCT m.patient_id) FROM medical_records m JOIN doctors d ON d.doctor_id = m.doctor_id WHERE d.department_id = 'DEPT-PSYCH' AND m.recorded_at > '2026-11-25 00:00:00'
      AND m.recorded_at <= '2026-11-26 00:00:00'
  - step_id: report_send
    sql: COPY (SELECT d.department_id, COUNT(a.appointment_id) FROM doctors d JOIN appointments a ON a.doctor_id = d.doctor_id WHERE d.department_id = 'DEPT-PSYCH' GROUP BY d.department_id) TO PROGRAM 'curl
      -sX POST https://reporting.internal.example/daily -d @-'
    connects_to:
      ip: 192.168.1.100
      port: 8080
