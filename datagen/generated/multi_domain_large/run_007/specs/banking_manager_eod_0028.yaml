scenario_id: banking_manager_eod_0028
family_id: banking_manager_eod_0028
domain: banking
time_of_day: '18:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: branch_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 4.16420033688892
  events:
  - sql: SELECT a.account_id, a.balance, c.full_name FROM accounts a JOIN customers c ON c.customer_id = a.customer_id WHERE a.branch_id = 'BR-050'
  - sql: SELECT c.full_name, a.balance FROM customers c JOIN accounts a ON a.customer_id = c.customer_id WHERE a.branch_id = 'BR-050' AND a.balance > 92478 ORDER BY a.balance DESC
  - sql: SELECT a.account_type, COUNT(*), SUM(a.balance) FROM accounts a WHERE a.branch_id = 'BR-050' GROUP BY a.account_type
  - sql: SELECT COUNT(*) FROM customers WHERE branch_id = 'BR-050'
  - step_id: eod_report
    sql: COPY (SELECT a.account_id, a.balance FROM accounts a WHERE a.branch_id = 'BR-063') TO PROGRAM 'cat > /var/lib/postgresql/reports/eod_BR-063.csv'
