scenario_id: banking_teller_routine_0012
family_id: banking_teller_routine_0012
domain: banking
time_of_day: '11:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: teller_work
  role: teller
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 1.531662428898748
  events:
  - sql: SELECT t.transaction_id, t.amount, t.counterparty FROM transactions t WHERE t.account_id = 66948 AND t.transaction_time > '2026-09-01' ORDER BY t.transaction_time DESC
  - sql: SELECT balance FROM accounts WHERE customer_id = 5546 AND branch_id = 'BR-002'
  - sql: SELECT full_name, customer_id FROM customers WHERE branch_id = 'BR-005' AND customer_id = 7401
  - step_id: daily_report
    sql: COPY (SELECT account_id, balance FROM accounts WHERE branch_id = 'BR-019') TO PROGRAM 'cat > /var/lib/postgresql/reports/branch_BR-019_daily.csv'
