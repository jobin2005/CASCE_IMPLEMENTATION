scenario_id: ecommerce_support_agent_routine_0018
family_id: ecommerce_support_agent_routine_0018
domain: ecommerce
time_of_day: '10:45'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: support_agent_work
  role: support_agent
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.2090356313027795
  events:
  - sql: UPDATE orders SET status = 'returned' WHERE order_id = 98594 AND customer_id = 53105
  - sql: SELECT oi.product_id, p.name, oi.quantity, oi.unit_price FROM order_items oi JOIN products p ON p.product_id = oi.product_id WHERE oi.order_id = 95249
