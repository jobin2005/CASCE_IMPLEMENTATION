scenario_id: ecommerce_support_agent_routine_0014
family_id: ecommerce_support_agent_routine_0014
domain: ecommerce
time_of_day: '10:45'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: support_agent_work
  role: support_agent
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 1.918122632232489
  events:
  - sql: SELECT c.full_name, c.email FROM customers c WHERE c.customer_id = 65540
  - sql: SELECT c.full_name, c.email, c.shipping_address FROM customers c WHERE c.customer_id = 65540
  - sql: SELECT c.full_name, c.email, c.shipping_address FROM customers c WHERE c.customer_id = 65540
  - sql: SELECT oi.product_id, p.name, oi.quantity, oi.unit_price FROM order_items oi JOIN products p ON p.product_id = oi.product_id WHERE oi.order_id = 88902
  - sql: UPDATE orders SET status = 'returned' WHERE order_id = 90444 AND customer_id = 65540
  - step_id: daily_report
    sql: COPY (SELECT o.order_id, o.status, o.total_amount FROM orders o WHERE o.customer_id = 59015 AND o.order_time > NOW() - INTERVAL '7 days') TO PROGRAM 'cat > /var/lib/postgresql/reports/support_escalation.csv'
