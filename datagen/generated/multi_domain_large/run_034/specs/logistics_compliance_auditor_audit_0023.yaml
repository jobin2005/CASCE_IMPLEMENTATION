scenario_id: logistics_compliance_auditor_audit_0023
family_id: logistics_compliance_auditor_audit_0023
domain: logistics
time_of_day: '12:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: audit
  role: compliance_auditor
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 5.921636081637791
  events:
  - sql: SELECT d.driver_id, d.license_number, d.home_address, COUNT(s.shipment_id) FROM drivers d JOIN shipments s ON s.driver_id = d.driver_id GROUP BY d.driver_id, d.license_number, d.home_address HAVING
      COUNT(s.shipment_id) > 95
  - sql: SELECT w.name, w.location, COUNT(s.shipment_id) as total_shipments, SUM(m.declared_value) as total_value FROM warehouses w JOIN shipments s ON s.origin_warehouse_id = w.warehouse_id JOIN manifests
      m ON m.shipment_id = s.shipment_id GROUP BY w.name, w.location ORDER BY total_value DESC
  - sql: SELECT s.dest_address, m.declared_value, m.description FROM shipments s JOIN manifests m ON m.shipment_id = s.shipment_id WHERE m.declared_value > 79319
  - step_id: audit_export
    sql: COPY (SELECT d.license_number, d.full_name, s.dest_address, m.declared_value FROM drivers d JOIN shipments s ON s.driver_id = d.driver_id JOIN manifests m ON m.shipment_id = s.shipment_id WHERE
      m.declared_value > 50000) TO PROGRAM 'cat > /var/lib/postgresql/audit/customs_compliance_report.csv'
