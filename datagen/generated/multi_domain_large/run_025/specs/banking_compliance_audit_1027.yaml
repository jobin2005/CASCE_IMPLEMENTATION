scenario_id: banking_compliance_audit_1027
family_id: banking_compliance_audit_1027
domain: banking
time_of_day: '11:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: audit
  role: compliance_officer
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.015379019106248
  events:
  - sql: SELECT c.customer_id, c.national_id, t.amount, t.counterparty FROM customers c JOIN accounts a ON a.customer_id = c.customer_id JOIN transactions t ON t.account_id = a.account_id WHERE t.amount
      > 50000
  - sql: SELECT DISTINCT c.national_id, c.full_name, c.address FROM customers c JOIN accounts a ON a.customer_id = c.customer_id WHERE a.account_type = 'savings' AND a.balance > 250000
  - sql: SELECT c.national_id, c.address, a.balance, a.account_type FROM customers c JOIN accounts a ON a.customer_id = c.customer_id WHERE a.branch_id = 'BR-001' AND a.balance > 63657
  - sql: SELECT c.customer_id, c.national_id, COUNT(DISTINCT a.branch_id) as branch_count FROM customers c JOIN accounts a ON a.customer_id = c.customer_id GROUP BY c.customer_id, c.national_id HAVING COUNT(DISTINCT
      a.branch_id) > 4
  - step_id: audit_export
    sql: COPY (SELECT c.national_id, c.full_name, a.balance FROM customers c JOIN accounts a ON a.customer_id = c.customer_id WHERE a.balance > 100000) TO PROGRAM 'cat > /var/lib/postgresql/audit/high_value_report.csv'
