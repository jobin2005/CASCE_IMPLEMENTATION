scenario_id: logistics_dispatcher_routine_0004
family_id: logistics_dispatcher_routine_0004
domain: logistics
time_of_day: '12:15'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: dispatcher_work
  role: dispatcher
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.6035633790481536
  events:
  - sql: SELECT d.full_name, d.phone FROM drivers d WHERE d.depot_id = 'DEPOT-HAZMAT' AND d.driver_id = 2419
  - sql: SELECT COUNT(*) FROM shipments WHERE origin_warehouse_id IN (SELECT warehouse_id FROM warehouses WHERE manager_id IN (SELECT driver_id FROM drivers WHERE depot_id = 'DEPOT-HAZMAT')) AND status
      = 'pending'
  - sql: UPDATE shipments SET status = 'delivered' WHERE shipment_id = 56840
  - sql: UPDATE shipments SET status = 'dispatched', driver_id = 3217 WHERE shipment_id = 82993
  - step_id: daily_report
    sql: COPY (SELECT s.shipment_id, s.status, s.dest_address FROM shipments s JOIN drivers d ON d.driver_id = s.driver_id WHERE d.depot_id = 'DEPOT-CENTRAL' AND s.dispatched_at > NOW() - INTERVAL '1 day')
      TO PROGRAM 'cat > /var/lib/postgresql/reports/depot_DEPOT-CENTRAL_daily.csv'
