scenario_id: ecommerce_catalog_manager_eod_0004
family_id: ecommerce_catalog_manager_eod_0004
domain: ecommerce
time_of_day: '18:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: catalog_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.015972008289138
  events:
  - sql: SELECT product_id, name, stock_qty FROM products WHERE stock_qty < 8 AND category = 'Automotive'
  - sql: SELECT product_id, name, price, stock_qty FROM products WHERE category = 'Automotive' ORDER BY stock_qty ASC
  - sql: UPDATE products SET price = 260.99 WHERE product_id = 2047
  - sql: SELECT p.name, p.category, COUNT(oi.order_item_id) as order_count FROM products p JOIN order_items oi ON oi.product_id = p.product_id GROUP BY p.name, p.category HAVING COUNT(oi.order_item_id)
      > 103 ORDER BY order_count DESC
  - step_id: eod_report
    sql: COPY (SELECT p.product_id, p.name, p.price, p.stock_qty FROM products p WHERE p.category = 'Jewelry') TO PROGRAM 'cat > /var/lib/postgresql/reports/catalog_update.csv'
