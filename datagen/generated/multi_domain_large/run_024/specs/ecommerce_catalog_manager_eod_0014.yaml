scenario_id: ecommerce_catalog_manager_eod_0014
family_id: ecommerce_catalog_manager_eod_0014
domain: ecommerce
time_of_day: '17:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: catalog_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.3189974875791153
  events:
  - sql: SELECT p.name, p.category, COUNT(oi.order_item_id) as order_count FROM products p JOIN order_items oi ON oi.product_id = p.product_id GROUP BY p.name, p.category HAVING COUNT(oi.order_item_id)
      > 179 ORDER BY order_count DESC
  - sql: SELECT product_id, name, stock_qty FROM products WHERE stock_qty < 11 AND category = 'Sports'
  - step_id: eod_report
    sql: COPY (SELECT p.product_id, p.name, p.price, p.stock_qty FROM products p WHERE p.category = 'Food') TO PROGRAM 'cat > /var/lib/postgresql/reports/catalog_update.csv'
