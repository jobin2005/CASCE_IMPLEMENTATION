scenario_id: logistics_dispatcher_routine_0016
family_id: logistics_dispatcher_routine_0016
domain: logistics
time_of_day: '13:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: dispatcher_work
  role: dispatcher
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.9148225423892473
  events:
  - sql: UPDATE shipments SET status = 'delivered' WHERE shipment_id = 87670
  - sql: SELECT s.shipment_id, s.status, s.dest_address, d.full_name FROM shipments s JOIN drivers d ON d.driver_id = s.driver_id WHERE d.depot_id = 'DEPOT-RAIL' AND s.status = 'pending' ORDER BY s.dispatched_at
  - sql: SELECT d.full_name, d.phone FROM drivers d WHERE d.depot_id = 'DEPOT-RAIL' AND d.driver_id = 3864
  - step_id: daily_report
    sql: COPY (SELECT s.shipment_id, s.status, s.dest_address FROM shipments s JOIN drivers d ON d.driver_id = s.driver_id WHERE d.depot_id = 'DEPOT-SOUTH' AND s.dispatched_at > NOW() - INTERVAL '1 day')
      TO PROGRAM 'cat > /var/lib/postgresql/reports/depot_DEPOT-SOUTH_daily.csv'
