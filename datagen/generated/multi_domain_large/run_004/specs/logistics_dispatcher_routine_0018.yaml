scenario_id: logistics_dispatcher_routine_0018
family_id: logistics_dispatcher_routine_0018
domain: logistics
time_of_day: '13:30'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: dispatcher_work
  role: dispatcher
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.3687021623459286
  events:
  - sql: SELECT v.vehicle_id, v.plate_number, v.capacity_kg FROM vehicles v WHERE v.depot_id = 'DEPOT-CENTRAL' AND v.vehicle_id NOT IN (SELECT vehicle_id FROM shipments WHERE status = 'in_transit')
  - sql: UPDATE shipments SET status = 'dispatched', driver_id = 4230 WHERE shipment_id = 78889
  - step_id: daily_report
    sql: COPY (SELECT s.shipment_id, s.status, s.dest_address FROM shipments s JOIN drivers d ON d.driver_id = s.driver_id WHERE d.depot_id = 'DEPOT-COLD' AND s.dispatched_at > NOW() - INTERVAL '1 day')
      TO PROGRAM 'cat > /var/lib/postgresql/reports/depot_DEPOT-COLD_daily.csv'
