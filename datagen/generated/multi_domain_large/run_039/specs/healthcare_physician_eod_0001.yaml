scenario_id: healthcare_physician_eod_0001
family_id: healthcare_physician_eod_0001
domain: healthcare
time_of_day: '17:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: physician
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 4.465820400951287
  events:
  - sql: UPDATE appointments SET status = 'completed' WHERE appointment_id = 67706 AND doctor_id = 127
  - sql: SELECT COUNT(*) FROM appointments WHERE doctor_id = 127 AND status = 'completed' AND appointment_time > NOW() - INTERVAL '7 days'
  - sql: SELECT p.patient_id, p.full_name, m.diagnosis_code, m.recorded_at FROM patients p JOIN medical_records m ON m.patient_id = p.patient_id WHERE m.doctor_id = 127 ORDER BY m.recorded_at DESC
  - step_id: eod_report
    sql: COPY (SELECT a.appointment_id, p.full_name, a.reason FROM appointments a JOIN patients p ON p.patient_id = a.patient_id WHERE a.doctor_id IN (SELECT doctor_id FROM doctors WHERE department_id =
      'DEPT-DERM') AND a.appointment_time > NOW() - INTERVAL '1 day') TO PROGRAM 'cat > /var/lib/postgresql/reports/dept_DEPT-DERM_daily.csv'
