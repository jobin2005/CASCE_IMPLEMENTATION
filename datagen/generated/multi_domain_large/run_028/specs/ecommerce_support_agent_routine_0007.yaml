scenario_id: ecommerce_support_agent_routine_0007
family_id: ecommerce_support_agent_routine_0007
domain: ecommerce
time_of_day: 09:00
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: support_agent_work
  role: support_agent
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.145636035803366
  events:
  - sql: SELECT oi.product_id, p.name, oi.quantity, oi.unit_price FROM order_items oi JOIN products p ON p.product_id = oi.product_id WHERE oi.order_id = 98902
  - sql: SELECT COUNT(*) FROM orders WHERE customer_id = 35221 AND order_time > NOW() - INTERVAL '30 days'
  - step_id: daily_report
    sql: COPY (SELECT o.order_id, o.status, o.total_amount FROM orders o WHERE o.customer_id = 75881 AND o.order_time > NOW() - INTERVAL '7 days') TO PROGRAM 'cat > /var/lib/postgresql/reports/support_escalation.csv'
