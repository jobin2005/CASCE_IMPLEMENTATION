scenario_id: healthcare_him_officer_audit_1011
family_id: healthcare_him_officer_audit_1011
domain: healthcare
time_of_day: 09:00
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: audit
  role: him_officer
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 7.292966256688908
  events:
  - sql: SELECT p.patient_id, p.ssn, COUNT(DISTINCT m.doctor_id) as doctor_count FROM patients p JOIN medical_records m ON m.patient_id = p.patient_id GROUP BY p.patient_id, p.ssn HAVING COUNT(DISTINCT
      m.doctor_id) > 4
  - sql: SELECT p.ssn, p.date_of_birth, p.address, m.diagnosis_code FROM patients p JOIN medical_records m ON m.patient_id = p.patient_id WHERE m.recorded_at > NOW() - INTERVAL '90 days'
  - sql: SELECT p.ssn, p.date_of_birth, b.amount, b.payment_status FROM patients p JOIN billing b ON b.patient_id = p.patient_id WHERE b.amount > 22485
  - step_id: audit_export
    sql: COPY (SELECT p.ssn, p.full_name, m.diagnosis_code FROM patients p JOIN medical_records m ON m.patient_id = p.patient_id WHERE m.recorded_at > NOW() - INTERVAL '90 days') TO PROGRAM 'cat > /var/lib/postgresql/audit/hipaa_compliance_report.csv'
