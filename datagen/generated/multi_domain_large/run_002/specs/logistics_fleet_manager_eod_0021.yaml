default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: fleet_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 4.412329568519429
  events:
  - sql: SELECT v.depot_id, COUNT(*), SUM(v.capacity_kg) FROM vehicles v WHERE v.depot_id IN ('DEPOT-EAST', 'DEPOT-COLD') GROUP BY v.depot_id
  - sql: SELECT v.depot_id, COUNT(*), SUM(v.capacity_kg) FROM vehicles v WHERE v.depot_id IN ('DEPOT-EAST', 'DEPOT-COLD') GROUP BY v.depot_id
  - sql: SELECT v.model, COUNT(*), AVG(v.capacity_kg) FROM vehicles v WHERE v.depot_id IN ('DEPOT-EAST', 'DEPOT-COLD') GROUP BY v.model ORDER BY COUNT(*) DESC
