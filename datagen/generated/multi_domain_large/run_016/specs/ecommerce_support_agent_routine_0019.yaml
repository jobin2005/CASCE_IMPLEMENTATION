rule_engine_relationship: agrees
sessions:
- session_label: support_agent_work
  role: support_agent
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.1842447919545345
  events:
  - sql: SELECT order_id, order_time, total_amount, status FROM orders WHERE customer_id = 51383 ORDER BY order_time DESC LIMIT 5
  - sql: SELECT o.order_id, o.status, o.total_amount FROM orders o WHERE o.customer_id = 51383 AND o.status = 'shipped'
