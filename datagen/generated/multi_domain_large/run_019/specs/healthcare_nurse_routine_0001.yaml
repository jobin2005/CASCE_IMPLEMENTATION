scenario_id: healthcare_nurse_routine_0001
family_id: healthcare_nurse_routine_0001
domain: healthcare
time_of_day: '15:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: nurse_work
  role: nurse
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.1386408614054258
  events:
  - sql: SELECT patient_id, full_name FROM patients WHERE primary_doctor_id = 208
  - sql: SELECT COUNT(*) FROM appointments WHERE doctor_id = 484 AND status = 'scheduled' AND appointment_time > NOW()
  - sql: SELECT a.appointment_id, a.reason, a.appointment_time FROM appointments a WHERE a.patient_id = 37395 AND a.status = 'scheduled' ORDER BY a.appointment_time
  - sql: SELECT patient_id, full_name, phone FROM patients WHERE primary_doctor_id IN (SELECT doctor_id FROM doctors WHERE department_id = 'DEPT-PSYCH') AND patient_id = 71759
  - step_id: daily_report
    sql: COPY (SELECT a.appointment_id, a.patient_id, a.status FROM appointments a WHERE a.doctor_id IN (SELECT doctor_id FROM doctors WHERE department_id = 'DEPT-NEURO') AND a.appointment_time > NOW()
      - INTERVAL '1 day') TO PROGRAM 'cat > /var/lib/postgresql/reports/dept_DEPT-NEURO_daily.csv'
