rule_engine_relationship: agrees
sessions:
- session_label: nurse_work
  role: nurse
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.6046507639413363
  events:
  - sql: SELECT patient_id, full_name FROM patients WHERE primary_doctor_id = 322
  - sql: UPDATE patients SET phone = '555-9576' WHERE patient_id = 93858
