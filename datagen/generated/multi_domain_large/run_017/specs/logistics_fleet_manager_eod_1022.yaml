scenario_id: logistics_fleet_manager_eod_1022
family_id: logistics_fleet_manager_eod_1022
domain: logistics
time_of_day: '18:30'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: fleet_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.816402391354872
  events:
  - sql: SELECT s.origin_warehouse_id, COUNT(*), AVG(m.weight_kg) FROM shipments s JOIN manifests m ON m.shipment_id = s.shipment_id WHERE s.status = 'delivered' AND s.dispatched_at > NOW() - INTERVAL '30
      days' GROUP BY s.origin_warehouse_id
  - sql: SELECT v.depot_id, COUNT(*), SUM(v.capacity_kg) FROM vehicles v WHERE v.depot_id IN ('DEPOT-EAST', 'DEPOT-HAZMAT') GROUP BY v.depot_id
  - sql: SELECT v.model, COUNT(*), AVG(v.capacity_kg) FROM vehicles v WHERE v.depot_id IN ('DEPOT-EAST', 'DEPOT-HAZMAT') GROUP BY v.model ORDER BY COUNT(*) DESC
  - step_id: eod_report
    sql: COPY (SELECT v.vehicle_id, v.plate_number, v.capacity_kg FROM vehicles v WHERE v.depot_id = 'DEPOT-CENTRAL') TO PROGRAM 'cat > /var/lib/postgresql/reports/fleet_DEPOT-CENTRAL_status.csv'
