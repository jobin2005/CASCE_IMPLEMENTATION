scenario_id: banking_manager_eod_0009
family_id: banking_manager_eod_0009
domain: banking
time_of_day: '17:30'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: branch_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.968358815709362
  events:
  - sql: SELECT DATE(t.transaction_time), SUM(t.amount) FROM transactions t JOIN accounts a ON a.account_id = t.account_id WHERE a.branch_id = 'BR-005' AND t.transaction_time > NOW() - INTERVAL '30 days'
      GROUP BY DATE(t.transaction_time)
  - sql: SELECT COUNT(*) FROM customers WHERE branch_id = 'BR-005'
  - step_id: eod_report
    sql: COPY (SELECT a.account_id, a.balance FROM accounts a WHERE a.branch_id = 'BR-011') TO PROGRAM 'cat > /var/lib/postgresql/reports/eod_BR-011.csv'
