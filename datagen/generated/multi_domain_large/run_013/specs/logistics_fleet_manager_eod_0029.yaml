scenario_id: logistics_fleet_manager_eod_0029
family_id: logistics_fleet_manager_eod_0029
domain: logistics
time_of_day: '16:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: fleet_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.644416291185201
  events:
  - sql: SELECT s.origin_warehouse_id, COUNT(*), AVG(m.weight_kg) FROM shipments s JOIN manifests m ON m.shipment_id = s.shipment_id WHERE s.status = 'delivered' AND s.dispatched_at > NOW() - INTERVAL '30
      days' GROUP BY s.origin_warehouse_id
  - sql: SELECT v.model, COUNT(*), AVG(v.capacity_kg) FROM vehicles v WHERE v.depot_id IN ('DEPOT-WEST', 'DEPOT-CENTRAL', 'DEPOT-HUB-1', 'DEPOT-HAZMAT') GROUP BY v.model ORDER BY COUNT(*) DESC
  - sql: SELECT s.origin_warehouse_id, COUNT(*), AVG(m.weight_kg) FROM shipments s JOIN manifests m ON m.shipment_id = s.shipment_id WHERE s.status = 'delivered' AND s.dispatched_at > NOW() - INTERVAL '30
      days' GROUP BY s.origin_warehouse_id
  - step_id: eod_report
    sql: COPY (SELECT v.vehicle_id, v.plate_number, v.capacity_kg FROM vehicles v WHERE v.depot_id = 'DEPOT-SOUTH') TO PROGRAM 'cat > /var/lib/postgresql/reports/fleet_DEPOT-SOUTH_status.csv'
