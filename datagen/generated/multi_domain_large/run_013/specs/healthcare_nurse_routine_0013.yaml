scenario_id: healthcare_nurse_routine_0013
family_id: healthcare_nurse_routine_0013
domain: healthcare
time_of_day: '14:15'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: nurse_work
  role: nurse
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.36052482335702
  events:
  - sql: SELECT a.appointment_id, a.reason, a.appointment_time FROM appointments a WHERE a.patient_id = 48506 AND a.status = 'scheduled' ORDER BY a.appointment_time
  - sql: UPDATE patients SET phone = '555-3096' WHERE patient_id = 43902
  - sql: UPDATE appointments SET status = 'checked_in' WHERE appointment_id = 86585 AND patient_id = 33741
  - sql: SELECT p.prescription_id, p.drug_name, p.dosage FROM prescriptions p WHERE p.patient_id = 22793 ORDER BY p.issued_at DESC LIMIT 5
  - step_id: daily_report
    sql: COPY (SELECT a.appointment_id, a.patient_id, a.status FROM appointments a WHERE a.doctor_id IN (SELECT doctor_id FROM doctors WHERE department_id = 'DEPT-EMERG') AND a.appointment_time > NOW()
      - INTERVAL '1 day') TO PROGRAM 'cat > /var/lib/postgresql/reports/dept_DEPT-EMERG_daily.csv'
