  - sql: SELECT p.prescription_id, p.drug_name, p.dosage FROM prescriptions p WHERE p.patient_id = 87656 ORDER BY p.issued_at DESC LIMIT 5
  - sql: SELECT COUNT(*) FROM appointments WHERE doctor_id = 242 AND status = 'scheduled' AND appointment_time > NOW()
