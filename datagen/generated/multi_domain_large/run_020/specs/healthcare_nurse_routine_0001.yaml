scenario_id: healthcare_nurse_routine_0001
family_id: healthcare_nurse_routine_0001
domain: healthcare
time_of_day: '16:15'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: nurse_work
  role: nurse
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 1.8050580750148637
  events:
  - sql: SELECT a.appointment_id, p.full_name, a.reason FROM appointments a JOIN patients p ON p.patient_id = a.patient_id WHERE a.doctor_id = 134 AND a.appointment_time > NOW() - INTERVAL '1 day' ORDER
      BY a.appointment_time
  - sql: UPDATE appointments SET status = 'checked_in' WHERE appointment_id = 73605 AND patient_id = 14697
  - sql: SELECT patient_id, full_name FROM patients WHERE primary_doctor_id = 265
  - step_id: daily_report
    sql: COPY (SELECT a.appointment_id, a.patient_id, a.status FROM appointments a WHERE a.doctor_id IN (SELECT doctor_id FROM doctors WHERE department_id = 'DEPT-RADIO') AND a.appointment_time > NOW()
      - INTERVAL '1 day') TO PROGRAM 'cat > /var/lib/postgresql/reports/dept_DEPT-RADIO_daily.csv'
