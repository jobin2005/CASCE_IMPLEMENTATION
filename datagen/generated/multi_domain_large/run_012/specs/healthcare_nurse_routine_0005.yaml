scenario_id: healthcare_nurse_routine_0005
family_id: healthcare_nurse_routine_0005
domain: healthcare
time_of_day: '11:45'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: nurse_work
  role: nurse
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 1.5949093530002494
  events:
  - sql: SELECT a.appointment_id, a.reason, a.appointment_time FROM appointments a WHERE a.patient_id = 51681 AND a.status = 'scheduled' ORDER BY a.appointment_time
  - sql: SELECT p.prescription_id, p.drug_name, p.dosage FROM prescriptions p WHERE p.patient_id = 57026 ORDER BY p.issued_at DESC LIMIT 5
  - sql: SELECT COUNT(*) FROM appointments WHERE doctor_id = 388 AND status = 'scheduled' AND appointment_time > NOW()
  - sql: SELECT patient_id, full_name FROM patients WHERE primary_doctor_id = 402
  - step_id: daily_report
    sql: COPY (SELECT a.appointment_id, a.patient_id, a.status FROM appointments a WHERE a.doctor_id IN (SELECT doctor_id FROM doctors WHERE department_id = 'DEPT-SURG') AND a.appointment_time > NOW() -
      INTERVAL '1 day') TO PROGRAM 'cat > /var/lib/postgresql/reports/dept_DEPT-SURG_daily.csv'
