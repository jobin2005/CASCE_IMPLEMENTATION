rule_engine_relationship: agrees
sessions:
- session_label: nurse_work
  role: nurse
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.643469692365391
  events:
  - sql: SELECT p.prescription_id, p.drug_name, p.dosage FROM prescriptions p WHERE p.patient_id = 35679 ORDER BY p.issued_at DESC LIMIT 5
  - sql: UPDATE patients SET phone = '555-2978' WHERE patient_id = 61497
  - sql: UPDATE appointments SET status = 'checked_in' WHERE appointment_id = 57009 AND patient_id = 43330
  - sql: SELECT a.appointment_id, p.full_name, a.reason FROM appointments a JOIN patients p ON p.patient_id = a.patient_id WHERE a.doctor_id = 210 AND a.appointment_time > NOW() - INTERVAL '1 day' ORDER
