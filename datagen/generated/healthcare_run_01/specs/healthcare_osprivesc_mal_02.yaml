scenario_id: healthcare_osprivesc_mal_02
family_id: healthcare_os_priv_escalation_b
domain: healthcare
matched_pair_id: healthcare_osprivesc_pair_02
matched_dimensions:
  fixed: [syscall_sequence, timing_pattern, role]
  varied: [process_tree_shape]
time_of_day: "04:10"
default_class: malicious
rule_engine_relationship: malicious_false_negative
sessions:
  - session_label: escalate
    role: postgres
    anchor: synthetic
    anchor_query: "SELECT 1"
    timing:
      tempo: bursty
      step_gaps_seconds: [0.8]
    events:
      - step_id: copy_bin
        process: {comm: cp, args: ["/usr/bin/python3", "/tmp/.pysvc"]}
      - step_id: set_suid
        process: {comm: chmod, args: ["u+s", "/tmp/.pysvc"], parent: copy_bin}
      - step_id: run_root
        process: {comm: /tmp/.pysvc, args: ["-c", "import os; os.system('id')"], parent: set_suid}
