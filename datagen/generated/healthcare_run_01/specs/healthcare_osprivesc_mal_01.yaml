scenario_id: healthcare_osprivesc_mal_01
family_id: healthcare_os_priv_escalation_a
domain: healthcare
matched_pair_id: healthcare_osprivesc_pair_01
matched_dimensions:
  fixed: [syscall_sequence, timing_pattern, role]
  varied: [process_tree_shape]
time_of_day: "02:50"
default_class: malicious
rule_engine_relationship: agrees
sessions:
  - session_label: escalate
    role: postgres
    anchor: synthetic
    anchor_query: "SELECT 1"
    timing:
      tempo: bursty
      step_gaps_seconds: [1.0]
    events:
      - step_id: copy_bash
        process: {comm: cp, args: ["/bin/bash", "/tmp/.rootbash"]}
      - step_id: set_suid
        process: {comm: chmod, args: ["u+s", "/tmp/.rootbash"], parent: copy_bash}
      - step_id: run_root
        process: {comm: /tmp/.rootbash, args: ["-p", "-c", "id"], parent: set_suid}
