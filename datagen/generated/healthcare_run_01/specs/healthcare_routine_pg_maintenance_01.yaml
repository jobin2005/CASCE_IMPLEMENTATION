scenario_id: healthcare_routine_pg_maintenance_01
family_id: healthcare_routine_pg_maintenance
domain: healthcare
time_of_day: "03:40"
default_class: benign
rule_engine_relationship: agrees
sessions:
  - session_label: nightly_maint
    role: postgres
    anchor: synthetic
    anchor_query: "SELECT 1"
    timing:
      tempo: bursty
      step_gaps_seconds: [1.0]
    events:
      - step_id: copy_script
        process: {comm: cp, args: ["/usr/local/bin/his_nightly_maintenance.sh", "/tmp/his_nightly_maintenance.sh"]}
      - step_id: set_exec
        process: {comm: chmod, args: ["u+x", "/tmp/his_nightly_maintenance.sh"], parent: copy_script}
      - step_id: run_maint
        process: {comm: /tmp/his_nightly_maintenance.sh, args: ["--vacuum-analyze", "--reindex-audit-log"], parent: set_exec}
      - step_id: cleanup
        process: {comm: rm, args: ["/tmp/his_nightly_maintenance.sh"], parent: run_maint}
      - file: {path: "/tmp/his_nightly_maintenance.sh", syscall: unlink, parent: cleanup}
