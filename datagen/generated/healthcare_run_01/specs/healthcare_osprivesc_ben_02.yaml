scenario_id: healthcare_osprivesc_ben_02
family_id: healthcare_os_priv_escalation_b
domain: healthcare
matched_pair_id: healthcare_osprivesc_pair_02
matched_dimensions:
  fixed: [syscall_sequence, timing_pattern, role]
  varied: [process_tree_shape]
time_of_day: "04:10"
default_class: benign
rule_engine_relationship: agrees
sessions:
  - session_label: escalate
    role: postgres
    anchor: synthetic
    anchor_query: "SELECT 1"
    timing:
      tempo: bursty
      step_gaps_seconds: [0.8]
    events:
      - step_id: copy_script
        process: {comm: cp, args: ["/usr/local/bin/emr_backup_d03.sh", "/tmp/emr_backup_d03.sh"]}
      - step_id: set_exec
        process: {comm: chmod, args: ["u+x", "/tmp/emr_backup_d03.sh"], parent: copy_script}
      - step_id: run_backup
        process: {comm: /tmp/emr_backup_d03.sh, args: ["--full", "--dept=D-03"], parent: set_exec}
