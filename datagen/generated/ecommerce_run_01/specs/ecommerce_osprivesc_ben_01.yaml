scenario_id: ecommerce_osprivesc_ben_01
family_id: ecommerce_osprivesc_suid_bash
domain: ecommerce
matched_pair_id: ecommerce_osprivesc_pair_01
matched_dimensions:
  fixed: [syscall_sequence, timing_pattern, role]
  varied: [process_tree_shape]
time_of_day: "03:40"
default_class: benign
rule_engine_relationship: benign_false_positive
sessions:
  - session_label: escalate
    role: postgres
    anchor: synthetic
    anchor_query: "SELECT 1"
    timing:
      tempo: bursty
      step_gaps_seconds: [1.0]
    events:
      - step_id: copy_script
        process: {comm: cp, args: ["/usr/local/bin/order_index_rebuild.sh", "/tmp/order_index_rebuild.sh"]}
      - step_id: set_exec
        process: {comm: chmod, args: ["u+x", "/tmp/order_index_rebuild.sh"], parent: copy_script}
      - step_id: run_maint
        process: {comm: /tmp/order_index_rebuild.sh, args: ["--rebuild"], parent: set_exec}
