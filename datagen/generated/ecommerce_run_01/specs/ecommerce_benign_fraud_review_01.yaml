scenario_id: ecommerce_benign_fraud_review_01
family_id: ecommerce_fraud_review_routine
domain: ecommerce
default_class: benign
rule_engine_relationship: agrees
time_of_day: "04:50"
sessions:
  - session_label: scan
    role: fraud_analyst
    anchor: db
    timing:
      tempo: steady
      step_gaps_seconds: [4.0]
    events:
      - step_id: scan
        sql: "SELECT o.order_id, c.email, c.phone, p.card_last4 FROM orders o JOIN customers c ON c.customer_id = o.customer_id JOIN payments p ON p.order_id = o.order_id WHERE o.status = 'flagged'"
      - step_id: log_case
        process: {comm: python3, args: ["/opt/vbo/fraud/case_logger.py", "--case-batch"]}
      - step_id: write_note
        file: {path: "/var/vbo/fraud/reviewed/case_batch_2026-09-21.json", syscall: openat, parent: log_case}
