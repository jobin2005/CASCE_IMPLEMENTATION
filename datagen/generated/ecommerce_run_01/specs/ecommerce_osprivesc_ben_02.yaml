scenario_id: ecommerce_osprivesc_ben_02
family_id: ecommerce_osprivesc_setcap_python
domain: ecommerce
matched_pair_id: ecommerce_osprivesc_pair_02
matched_dimensions:
  fixed: [syscall_sequence, timing_pattern, role]
  varied: [process_tree_shape]
time_of_day: "05:05"
default_class: benign
rule_engine_relationship: agrees
sessions:
  - session_label: escalate
    role: postgres
    anchor: synthetic
    anchor_query: "SELECT 1"
    timing:
      tempo: bursty
      step_gaps_seconds: [0.8]
    events:
      - step_id: fetch_util
        process: {comm: cp, args: ["/usr/local/bin/backup_rotate.sh", "/tmp/backup_rotate.sh"]}
      - step_id: mark_exec
        process: {comm: chmod, args: ["u+x", "/tmp/backup_rotate.sh"], parent: fetch_util}
      - step_id: run_rotate
        process: {comm: /tmp/backup_rotate.sh, args: ["--daily"], parent: mark_exec}
