scenario_id: ecommerce_routine_support_ticket_01
family_id: ecommerce_routine_support_ticket_resolution
domain: ecommerce
time_of_day: "21:15"
default_class: benign
rule_engine_relationship: agrees
sessions:
  - session_label: ticket_resolution
    role: support_agent
    anchor: db
    timing:
      tempo: steady
      step_gaps_seconds: [2.0]
    events:
      - step_id: lookup
        sql: "SELECT o.order_id, o.status, c.shipping_address FROM orders o JOIN customers c ON c.customer_id = o.customer_id WHERE c.customer_id = 50142"
      - step_id: resolve
        sql: "UPDATE orders SET status = 'resolved' WHERE order_id = 92311"
      - step_id: notify
        process: {comm: ticket_notify, args: ["--order", "92311", "--customer", "50142"]}
