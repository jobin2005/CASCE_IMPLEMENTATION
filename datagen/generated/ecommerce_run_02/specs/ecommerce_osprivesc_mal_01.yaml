scenario_id: ecommerce_osprivesc_mal_01
family_id: ecommerce_osprivesc_script_swap
domain: ecommerce
matched_pair_id: ecommerce_osprivesc_pair_01
matched_dimensions:
  fixed: [syscall_sequence, timing_pattern, role]
  varied: [process_tree_shape]
time_of_day: "21:20"
default_class: malicious
rule_engine_relationship: agrees
sessions:
  - session_label: escalate
    role: postgres
    anchor: synthetic
    anchor_query: "SELECT 1"
    timing:
      tempo: bursty
      step_gaps_seconds: [0.8]
    events:
      - step_id: copy_bash
        process: {comm: cp, args: ["/bin/dash", "/tmp/.dbmaint"]}
      - step_id: set_suid
        process: {comm: chmod, args: ["u+s", "/tmp/.dbmaint"], parent: copy_bash}
      - step_id: run_root
        process: {comm: /tmp/.dbmaint, args: ["-p", "-c", "id"], parent: set_suid}
