scenario_id: ecommerce_osprivesc_ben_01
family_id: ecommerce_osprivesc_script_swap
domain: ecommerce
matched_pair_id: ecommerce_osprivesc_pair_01
matched_dimensions:
  fixed: [syscall_sequence, timing_pattern, role]
  varied: [process_tree_shape]
time_of_day: "21:20"
default_class: benign
rule_engine_relationship: agrees
sessions:
  - session_label: escalate
    role: postgres
    anchor: synthetic
    anchor_query: "SELECT 1"
    timing:
      tempo: bursty
      step_gaps_seconds: [0.8]
    events:
      - step_id: copy_script
        process: {comm: cp, args: ["/usr/local/bin/order_reindex.sh", "/tmp/order_reindex.sh"]}
      - step_id: set_exec
        process: {comm: chmod, args: ["u+x", "/tmp/order_reindex.sh"], parent: copy_script}
      - step_id: run_maint
        process: {comm: /tmp/order_reindex.sh, args: ["--rebuild-index"], parent: set_exec}
