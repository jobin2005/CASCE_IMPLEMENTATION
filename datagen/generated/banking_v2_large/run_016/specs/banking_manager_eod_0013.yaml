scenario_id: banking_manager_eod_0013
family_id: banking_manager_eod_0013
domain: banking
time_of_day: '16:30'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: branch_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 4.591154531804575
  events:
  - sql: SELECT COUNT(*) FROM customers WHERE branch_id = 'BR-001'
  - sql: SELECT c.full_name, a.balance FROM customers c JOIN accounts a ON a.customer_id = c.customer_id WHERE a.branch_id = 'BR-001' AND a.balance > 21746 ORDER BY a.balance DESC
