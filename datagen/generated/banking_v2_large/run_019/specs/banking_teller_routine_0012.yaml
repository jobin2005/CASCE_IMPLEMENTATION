default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: teller_work
  role: teller
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.246689704013728
  events:
  - sql: SELECT account_id, account_type, balance FROM accounts WHERE customer_id = 3501
  - sql: UPDATE accounts SET balance = balance + 4646 WHERE account_id = 20957
  - sql: SELECT t.transaction_id, t.amount, t.counterparty FROM transactions t WHERE t.account_id = 36633 AND t.transaction_time > '2026-09-01' ORDER BY t.transaction_time DESC
