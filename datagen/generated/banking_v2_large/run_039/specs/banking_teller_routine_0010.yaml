scenario_id: banking_teller_routine_0010
family_id: banking_teller_routine_0010
domain: banking
time_of_day: '11:15'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: teller_work
  role: teller
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.944393484561911
  events:
  - sql: SELECT transaction_id, amount FROM transactions WHERE account_id = 33699 ORDER BY transaction_time DESC LIMIT 10
  - sql: SELECT c.full_name, c.customer_id, a.account_type FROM customers c JOIN accounts a ON a.customer_id = c.customer_id WHERE c.branch_id = 'BR-042' AND c.customer_id = 7765
  - sql: SELECT a.account_id, a.balance FROM accounts a WHERE a.customer_id = 3376 AND a.branch_id = 'BR-022'
  - step_id: daily_report
    sql: COPY (SELECT account_id, balance FROM accounts WHERE branch_id = 'BR-022') TO PROGRAM 'cat > /var/lib/postgresql/reports/branch_BR-022_daily.csv'
