scenario_id: banking_mgr_cross_branch_0004
family_id: banking_mgr_cross_branch_0004
domain: banking
time_of_day: '15:30'
default_class: benign
rule_engine_relationship: benign_false_positive
sessions:
- session_label: cross_branch_report
  role: branch_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.9547980477587426
  events:
  - sql: SELECT a.branch_id, COUNT(*), SUM(a.balance) FROM accounts a WHERE a.branch_id IN ('BR-019', 'BR-031', 'BR-011', 'BR-008') GROUP BY a.branch_id
  - sql: SELECT c.full_name, a.balance, a.branch_id FROM customers c JOIN accounts a ON a.customer_id = c.customer_id WHERE a.branch_id IN ('BR-019', 'BR-031', 'BR-011', 'BR-008') AND a.balance > 71671
  - step_id: report_export
    sql: COPY (SELECT a.branch_id, a.account_type, COUNT(*), SUM(a.balance) FROM accounts a WHERE a.branch_id IN ('BR-019', 'BR-031', 'BR-011', 'BR-008') GROUP BY a.branch_id, a.account_type) TO PROGRAM
      'curl -sX POST https://reports.internal.example/regional -d @-'
    connects_to:
      ip: 192.168.1.100
      port: 8080
