scenario_id: banking_teller_routine_0003
family_id: banking_teller_routine_0003
domain: banking
time_of_day: '11:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: teller_work
  role: teller
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 1.7809293519627607
  events:
  - sql: SELECT c.full_name, c.customer_id, a.account_type FROM customers c JOIN accounts a ON a.customer_id = c.customer_id WHERE c.branch_id = 'BR-063' AND c.customer_id = 4825
  - sql: SELECT account_id, account_type, balance FROM accounts WHERE customer_id = 5994
  - step_id: daily_report
    sql: COPY (SELECT account_id, balance FROM accounts WHERE branch_id = 'BR-022') TO PROGRAM 'cat > /var/lib/postgresql/reports/branch_BR-022_daily.csv'
