scenario_id: banking_manager_eod_1011
family_id: banking_manager_eod_1011
domain: banking
time_of_day: '17:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: branch_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 4.93937855319756
  events:
  - sql: SELECT c.customer_id, c.full_name, COUNT(t.transaction_id) as txn_count FROM customers c JOIN accounts a ON a.customer_id = c.customer_id JOIN transactions t ON t.account_id = a.account_id WHERE
      a.branch_id = 'BR-001' GROUP BY c.customer_id, c.full_name ORDER BY txn_count DESC LIMIT 20
  - sql: SELECT DATE(t.transaction_time), SUM(t.amount) FROM transactions t JOIN accounts a ON a.account_id = t.account_id WHERE a.branch_id = 'BR-001' AND t.transaction_time > NOW() - INTERVAL '30 days'
      GROUP BY DATE(t.transaction_time)
  - step_id: eod_report
    sql: COPY (SELECT a.account_id, a.balance FROM accounts a WHERE a.branch_id = 'BR-005') TO PROGRAM 'cat > /var/lib/postgresql/reports/eod_BR-005.csv'
