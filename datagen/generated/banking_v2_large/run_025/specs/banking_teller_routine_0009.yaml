scenario_id: banking_teller_routine_0009
family_id: banking_teller_routine_0009
domain: banking
time_of_day: '15:15'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: teller_work
  role: teller
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 1.7826413909441152
  events:
  - sql: SELECT COUNT(*) FROM transactions WHERE account_id = 60556 AND transaction_time > NOW() - INTERVAL '7 days'
  - sql: SELECT a.account_id, a.balance FROM accounts a WHERE a.customer_id = 6615 AND a.branch_id = 'BR-003'
  - step_id: daily_report
    sql: COPY (SELECT account_id, balance FROM accounts WHERE branch_id = 'BR-050') TO PROGRAM 'cat > /var/lib/postgresql/reports/branch_BR-050_daily.csv'
