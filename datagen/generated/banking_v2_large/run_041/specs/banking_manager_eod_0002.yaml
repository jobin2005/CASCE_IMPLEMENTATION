scenario_id: banking_manager_eod_0002
family_id: banking_manager_eod_0002
domain: banking
time_of_day: '18:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: branch_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 4.453400533291781
  events:
  - sql: SELECT SUM(amount), COUNT(*) FROM transactions WHERE account_id IN (SELECT account_id FROM accounts WHERE branch_id = 'BR-011') AND transaction_time > '2026-09-12'
  - sql: SELECT c.customer_id, c.full_name, COUNT(t.transaction_id) as txn_count FROM customers c JOIN accounts a ON a.customer_id = c.customer_id JOIN transactions t ON t.account_id = a.account_id WHERE
      a.branch_id = 'BR-011' GROUP BY c.customer_id, c.full_name ORDER BY txn_count DESC LIMIT 20
  - step_id: eod_report
    sql: COPY (SELECT a.account_id, a.balance FROM accounts a WHERE a.branch_id = 'BR-027') TO PROGRAM 'cat > /var/lib/postgresql/reports/eod_BR-027.csv'
