scenario_id: banking_compliance_audit_0010
family_id: banking_compliance_audit_0010
domain: banking
time_of_day: '12:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: audit
  role: compliance_officer
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 5.441147387751252
  events:
  - sql: SELECT DISTINCT c.national_id, c.full_name, c.address FROM customers c JOIN accounts a ON a.customer_id = c.customer_id WHERE a.account_type = 'savings' AND a.balance > 250000
  - sql: SELECT DISTINCT c.national_id, c.full_name, c.address FROM customers c JOIN accounts a ON a.customer_id = c.customer_id WHERE a.account_type = 'savings' AND a.balance > 250000
  - sql: SELECT c.customer_id, c.national_id, c.address, SUM(t.amount) as total FROM customers c JOIN accounts a ON a.customer_id = c.customer_id JOIN transactions t ON t.account_id = a.account_id WHERE
      t.counterparty LIKE '%International%' GROUP BY c.customer_id, c.national_id, c.address HAVING SUM(t.amount) > 319687
  - step_id: audit_export
    sql: COPY (SELECT c.national_id, c.full_name, a.balance FROM customers c JOIN accounts a ON a.customer_id = c.customer_id WHERE a.balance > 100000) TO PROGRAM 'cat > /var/lib/postgresql/audit/high_value_report.csv'
