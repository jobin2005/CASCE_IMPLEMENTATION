scenario_id: banking_manager_eod_1014
family_id: banking_manager_eod_1014
domain: banking
time_of_day: '18:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: branch_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 4.16420033688892
  events:
  - sql: SELECT COUNT(*) FROM customers WHERE branch_id = 'BR-022'
  - sql: SELECT DATE(t.transaction_time), SUM(t.amount) FROM transactions t JOIN accounts a ON a.account_id = t.account_id WHERE a.branch_id = 'BR-022' AND t.transaction_time > NOW() - INTERVAL '30 days'
      GROUP BY DATE(t.transaction_time)
  - step_id: eod_report
    sql: COPY (SELECT a.account_id, a.balance FROM accounts a WHERE a.branch_id = 'BR-031') TO PROGRAM 'cat > /var/lib/postgresql/reports/eod_BR-031.csv'
