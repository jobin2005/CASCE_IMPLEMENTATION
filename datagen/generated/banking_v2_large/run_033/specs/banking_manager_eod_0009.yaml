scenario_id: banking_manager_eod_0009
family_id: banking_manager_eod_0009
domain: banking
time_of_day: '18:30'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: branch_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 4.757336248911839
  events:
  - sql: SELECT c.customer_id, c.full_name, COUNT(t.transaction_id) as txn_count FROM customers c JOIN accounts a ON a.customer_id = c.customer_id JOIN transactions t ON t.account_id = a.account_id WHERE
      a.branch_id = 'BR-014' GROUP BY c.customer_id, c.full_name ORDER BY txn_count DESC LIMIT 20
  - sql: SELECT COUNT(*) FROM customers WHERE branch_id = 'BR-014'
  - sql: SELECT a.account_id, a.balance, c.full_name FROM accounts a JOIN customers c ON c.customer_id = a.customer_id WHERE a.branch_id = 'BR-014'
  - step_id: eod_report
    sql: COPY (SELECT a.account_id, a.balance FROM accounts a WHERE a.branch_id = 'BR-001') TO PROGRAM 'cat > /var/lib/postgresql/reports/eod_BR-001.csv'
