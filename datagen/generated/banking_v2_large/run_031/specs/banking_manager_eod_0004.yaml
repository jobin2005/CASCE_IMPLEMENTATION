scenario_id: banking_manager_eod_0004
family_id: banking_manager_eod_0004
domain: banking
time_of_day: '17:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: branch_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 4.604772951474239
  events:
  - sql: SELECT a.account_id, a.balance, c.full_name FROM accounts a JOIN customers c ON c.customer_id = a.customer_id WHERE a.branch_id = 'BR-011'
  - sql: SELECT a.account_type, COUNT(*), SUM(a.balance) FROM accounts a WHERE a.branch_id = 'BR-011' GROUP BY a.account_type
  - sql: SELECT c.full_name, a.balance FROM customers c JOIN accounts a ON a.customer_id = c.customer_id WHERE a.branch_id = 'BR-011' AND a.balance > 68580 ORDER BY a.balance DESC
  - sql: SELECT COUNT(*) FROM customers WHERE branch_id = 'BR-011'
  - step_id: eod_report
    sql: COPY (SELECT a.account_id, a.balance FROM accounts a WHERE a.branch_id = 'BR-031') TO PROGRAM 'cat > /var/lib/postgresql/reports/eod_BR-031.csv'
