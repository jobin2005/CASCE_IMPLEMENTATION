scenario_id: ecommerce_catalog_manager_eod_0021
family_id: ecommerce_catalog_manager_eod_0021
domain: ecommerce
time_of_day: '16:30'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: catalog_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 4.6299811713091055
  events:
  - sql: SELECT product_id, name, stock_qty FROM products WHERE stock_qty < 14 AND category = 'Jewelry'
  - sql: SELECT p.product_id, p.name, SUM(oi.quantity) as total_sold FROM products p JOIN order_items oi ON oi.product_id = p.product_id WHERE p.category = 'Jewelry' GROUP BY p.product_id, p.name ORDER
      BY total_sold DESC LIMIT 20
  - step_id: eod_report
    sql: COPY (SELECT p.product_id, p.name, p.price, p.stock_qty FROM products p WHERE p.category = 'Beauty') TO PROGRAM 'cat > /var/lib/postgresql/reports/catalog_update.csv'
