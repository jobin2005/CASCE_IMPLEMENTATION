  events:
  - sql: SELECT c.full_name, c.email, c.shipping_address FROM customers c WHERE c.customer_id = 44653
  - sql: UPDATE orders SET status = 'returned' WHERE order_id = 96503 AND customer_id = 44653
  - sql: UPDATE orders SET status = 'refunded' WHERE order_id = 82379 AND customer_id = 44653
  - sql: SELECT o.order_id, o.status, o.total_amount FROM orders o WHERE o.customer_id = 44653 AND o.status = 'shipped'
  - sql: SELECT c.full_name, c.email, c.shipping_address FROM customers c WHERE c.customer_id = 44653
  - step_id: daily_report
