default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: support_agent_work
  role: support_agent
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.4207833669498076
  events:
  - sql: SELECT oi.product_id, p.name, oi.quantity, oi.unit_price FROM order_items oi JOIN products p ON p.product_id = oi.product_id WHERE oi.order_id = 92381
  - sql: SELECT o.order_id, o.status, o.total_amount FROM orders o WHERE o.customer_id = 66228 AND o.status = 'shipped'
