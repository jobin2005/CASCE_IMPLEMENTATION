scenario_id: ecommerce_fraud_analyst_audit_0022
family_id: ecommerce_fraud_analyst_audit_0022
domain: ecommerce
time_of_day: '13:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: audit
  role: fraud_analyst
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 7.137280327215697
  events:
  - sql: SELECT c.customer_id, c.email, c.shipping_address, COUNT(o.order_id) as order_count, SUM(o.total_amount) as total_spent FROM customers c JOIN orders o ON o.customer_id = c.customer_id GROUP BY
      c.customer_id, c.email, c.shipping_address HAVING SUM(o.total_amount) > 10000
  - sql: SELECT c.email, c.phone, c.shipping_address, o.total_amount, pay.card_last4 FROM customers c JOIN orders o ON o.customer_id = c.customer_id JOIN payments pay ON pay.order_id = o.order_id WHERE
      o.total_amount > 4590
  - sql: SELECT c.email, c.shipping_address, pay.card_last4, pay.card_token FROM customers c JOIN orders o ON o.customer_id = c.customer_id JOIN payments pay ON pay.order_id = o.order_id WHERE pay.paid_at
      > NOW() - INTERVAL '24 hours' ORDER BY pay.amount DESC
  - sql: SELECT c.customer_id, c.email, c.phone, o.order_id, o.total_amount, o.status FROM customers c JOIN orders o ON o.customer_id = c.customer_id WHERE o.status = 'flagged' ORDER BY o.total_amount DESC
  - step_id: audit_export
    sql: COPY (SELECT c.email, c.phone, o.total_amount, pay.card_last4 FROM customers c JOIN orders o ON o.customer_id = c.customer_id JOIN payments pay ON pay.order_id = o.order_id WHERE o.total_amount
      > 1000) TO PROGRAM 'cat > /var/lib/postgresql/audit/fraud_review_report.csv'
