scenario_id: ecommerce_support_agent_routine_0015
family_id: ecommerce_support_agent_routine_0015
domain: ecommerce
time_of_day: '16:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: support_agent_work
  role: support_agent
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 1.5680866271088907
  events:
  - sql: SELECT oi.product_id, p.name, oi.quantity, oi.unit_price FROM order_items oi JOIN products p ON p.product_id = oi.product_id WHERE oi.order_id = 96230
  - sql: UPDATE orders SET status = 'returned' WHERE order_id = 89294 AND customer_id = 82812
  - step_id: daily_report
    sql: COPY (SELECT o.order_id, o.status, o.total_amount FROM orders o WHERE o.customer_id = 62804 AND o.order_time > NOW() - INTERVAL '7 days') TO PROGRAM 'cat > /var/lib/postgresql/reports/support_escalation.csv'
