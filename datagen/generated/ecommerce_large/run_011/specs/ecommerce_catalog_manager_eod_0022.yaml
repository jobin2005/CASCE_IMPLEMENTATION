scenario_id: ecommerce_catalog_manager_eod_0022
family_id: ecommerce_catalog_manager_eod_0022
domain: ecommerce
time_of_day: '18:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: catalog_manager
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.9029809508075495
  events:
  - sql: SELECT p.product_id, p.name, SUM(oi.quantity) as total_sold FROM products p JOIN order_items oi ON oi.product_id = p.product_id WHERE p.category = 'Toys' GROUP BY p.product_id, p.name ORDER BY
      total_sold DESC LIMIT 20
  - sql: UPDATE products SET stock_qty = stock_qty + 108 WHERE product_id = 7059
  - sql: SELECT p.name, p.category, COUNT(oi.order_item_id) as order_count FROM products p JOIN order_items oi ON oi.product_id = p.product_id GROUP BY p.name, p.category HAVING COUNT(oi.order_item_id)
      > 143 ORDER BY order_count DESC
  - step_id: eod_report
    sql: COPY (SELECT p.product_id, p.name, p.price, p.stock_qty FROM products p WHERE p.category = 'Clothing') TO PROGRAM 'cat > /var/lib/postgresql/reports/catalog_update.csv'
