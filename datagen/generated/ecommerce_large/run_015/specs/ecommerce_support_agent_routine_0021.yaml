scenario_id: ecommerce_support_agent_routine_0021
family_id: ecommerce_support_agent_routine_0021
domain: ecommerce
time_of_day: '11:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: support_agent_work
  role: support_agent
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.0939489898515733
  events:
  - sql: SELECT order_id, order_time, total_amount, status FROM orders WHERE customer_id = 34915 ORDER BY order_time DESC LIMIT 5
  - sql: SELECT oi.product_id, p.name, oi.quantity, oi.unit_price FROM order_items oi JOIN products p ON p.product_id = oi.product_id WHERE oi.order_id = 85140
  - sql: SELECT c.full_name, c.email FROM customers c WHERE c.customer_id = 34915
  - sql: UPDATE orders SET status = 'returned' WHERE order_id = 95562 AND customer_id = 34915
  - sql: UPDATE orders SET status = 'refunded' WHERE order_id = 91261 AND customer_id = 34915
  - step_id: daily_report
    sql: COPY (SELECT o.order_id, o.status, o.total_amount FROM orders o WHERE o.customer_id = 21064 AND o.order_time > NOW() - INTERVAL '7 days') TO PROGRAM 'cat > /var/lib/postgresql/reports/support_escalation.csv'
