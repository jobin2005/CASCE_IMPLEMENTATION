scenario_id: ecommerce_run_03_fraud_card_token_archive
family_id: ecommerce_run_03_fam_fraud_card_archive
domain: ecommerce
default_class: benign
rule_engine_relationship: benign_false_positive
time_of_day: "05:20"
sessions:
  - session_label: archive
    role: fraud_analyst
    anchor: db
    timing:
      tempo: steady
      step_gaps_seconds: [4.0]
    events:
      - step_id: dump
        sql: "COPY (SELECT p.payment_id, p.card_token, p.card_last4 FROM payments p JOIN orders o ON o.order_id = p.order_id WHERE o.status = 'flagged') TO PROGRAM 'gzip > /var/vbo/fraud/archive/card_review_2026-09-21.csv.gz'"
