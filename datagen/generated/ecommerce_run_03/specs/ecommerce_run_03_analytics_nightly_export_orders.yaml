scenario_id: ecommerce_run_03_analytics_nightly_export_orders
family_id: ecommerce_run_03_fam_analytics_export_orders
domain: ecommerce
default_class: benign
rule_engine_relationship: agrees
time_of_day: "02:15"
sessions:
  - session_label: nightly_export
    role: analytics_etl_service
    anchor: db
    timing:
      tempo: off_hours
      step_gaps_seconds: [4.0]
    events:
      - step_id: export_orders
        sql: "COPY (SELECT order_id, order_time, total_amount, status FROM orders WHERE order_time > '2026-09-20 00:00:00'::timestamp) TO PROGRAM 'curl -sX POST https://warehouse.partner-analytics.example/ingest -d @-'"
        connects_to: {ip: "203.0.113.44", port: 443}
