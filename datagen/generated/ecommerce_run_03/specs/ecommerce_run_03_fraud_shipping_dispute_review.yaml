scenario_id: ecommerce_run_03_fraud_shipping_dispute_review
family_id: ecommerce_run_03_fam_fraud_shipping_review
domain: ecommerce
default_class: benign
rule_engine_relationship: agrees
time_of_day: "05:35"
sessions:
  - session_label: dispute_review
    role: fraud_analyst
    anchor: db
    timing:
      tempo: steady
      step_gaps_seconds: [3.5]
    events:
      - step_id: pull_disputes
        sql: "SELECT o.order_id, c.shipping_address, c.phone FROM orders o JOIN customers c ON c.customer_id = o.customer_id WHERE o.status = 'flagged'"
      - step_id: summarize
        process: {comm: bash, args: ["/opt/vbo/fraud/summarize_disputes.sh", "--in-place"], parent: pull_disputes}
      - step_id: write_summary
        file: {path: "/var/vbo/fraud/reviewed/dispute_summary_2026-09-21.txt", syscall: openat, parent: summarize}
