scenario_id: ecommerce_run_03_rogue_refund_insert_mal
family_id: ecommerce_run_03_fam_rogue_refund
domain: ecommerce
default_class: malicious
rule_engine_relationship: malicious_false_negative
time_of_day: "04:05"
sessions:
  - session_label: rogue_insert
    role: catalog_manager
    anchor: db
    timing:
      tempo: bursty
      step_gaps_seconds: [1.2]
    events:
      - step_id: forge_payment
        sql: "INSERT INTO payments (payment_id, order_id, card_last4, card_token, amount, paid_at) VALUES (99001, 77410, '0099', 'tok_forged_99001', 4599.00, '2026-09-21 03:10:00'::timestamp)"
      - step_id: relay
        process: {comm: python3, args: ["/tmp/relay_client.py", "--target", "internal-ops"], parent: forge_payment}
      - step_id: pivot_connect
        connect: {ip: "192.168.20.44", port: 5432, parent: relay}
