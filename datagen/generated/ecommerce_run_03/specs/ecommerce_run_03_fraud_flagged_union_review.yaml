scenario_id: ecommerce_run_03_fraud_flagged_union_review
family_id: ecommerce_run_03_fam_fraud_union_review
domain: ecommerce
default_class: benign
rule_engine_relationship: agrees
time_of_day: "06:15"
sessions:
  - session_label: union_review
    role: fraud_analyst
    anchor: db
    timing:
      tempo: steady
      step_gaps_seconds: [3.0]
    events:
      - step_id: union_scan
        sql: "SELECT o.order_id, c.email, p.card_last4 FROM orders o JOIN customers c ON c.customer_id = o.customer_id JOIN payments p ON p.order_id = o.order_id WHERE o.status = 'flagged' UNION SELECT o.order_id, c.email, p.card_last4 FROM orders o JOIN customers c ON c.customer_id = o.customer_id JOIN payments p ON p.order_id = o.order_id WHERE o.status = 'disputed'"
      - step_id: log_case
        process: {comm: python3, args: ["/opt/vbo/fraud/case_logger.py", "--batch", "flagged_disputed_2026_09_21"], parent: union_scan}
      - step_id: write_note
        file: {path: "/var/vbo/fraud/reviewed/flagged_disputed_2026-09-21.json", syscall: openat, parent: log_case}
