scenario_id: ecommerce_run_03_fraud_monthly_sweep_review
family_id: ecommerce_run_03_fam_fraud_monthly_sweep
domain: ecommerce
default_class: benign
rule_engine_relationship: agrees
time_of_day: "06:00"
sessions:
  - session_label: monthly_sweep
    role: fraud_analyst
    anchor: db
    timing:
      tempo: steady
      step_gaps_seconds: [5.0]
    events:
      - step_id: sweep
        sql: "SELECT c.customer_id, c.email, c.phone, c.shipping_address, p.card_last4 FROM customers c JOIN orders o ON o.customer_id = c.customer_id JOIN payments p ON p.order_id = o.order_id WHERE o.order_time > '2026-08-21 00:00:00'::timestamp"
      - step_id: submit_case
        process: {comm: curl, args: ["-sX", "POST", "https://fraudops-intake.vbazaar.example/monthly-sweep", "--data-binary", "@-"], parent: sweep}
        connects_to: {ip: "10.0.12.5", port: 8443}
