scenario_id: ecommerce_run_03_catalog_lowstock_union_report
family_id: ecommerce_run_03_fam_catalog_union_report
domain: ecommerce
default_class: benign
rule_engine_relationship: agrees
time_of_day: "09:30"
sessions:
  - session_label: lowstock_report
    role: catalog_manager
    anchor: db
    timing:
      tempo: steady
      step_gaps_seconds: [2.5]
    events:
      - step_id: union_stock
        sql: "SELECT product_id, category, stock_qty FROM products WHERE category = 'electronics' AND stock_qty < 5 UNION SELECT product_id, category, stock_qty FROM products WHERE category = 'appliances' AND stock_qty < 5"
      - step_id: build_report
        process: {comm: python3, args: ["/opt/vbo/catalog/lowstock_report.py", "--categories", "electronics,appliances"], parent: union_stock}
      - step_id: write_report
        file: {path: "/var/vbo/catalog/reports/lowstock_2026-09-21.csv", syscall: openat, parent: build_report}
