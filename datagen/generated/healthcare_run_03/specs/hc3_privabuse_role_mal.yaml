scenario_id: hc3_privabuse_role_mal
family_id: healthcare_privilege_abuse_role
domain: healthcare
time_of_day: "04:10"
default_class: malicious
rule_engine_relationship: agrees
sessions:
  - session_label: role_escalation
    role: postgres
    anchor: db
    timing:
      tempo: bursty
      step_gaps_seconds: [1.0]
    events:
      - step_id: create_backdoor_role
        sql: "CREATE ROLE svc_shadow_admin WITH LOGIN PASSWORD 'ChangeMe123' SUPERUSER"
      - step_id: persist_key
        process: {comm: bash, args: ["-c", "echo svc_shadow_admin >> /etc/cron.d/pg_backup"], parent: create_backdoor_role}
      - file: {path: "/etc/cron.d/pg_backup", syscall: openat, parent: persist_key}
