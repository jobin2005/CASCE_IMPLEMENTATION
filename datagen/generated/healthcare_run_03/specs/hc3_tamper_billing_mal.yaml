scenario_id: hc3_tamper_billing_mal
family_id: healthcare_billing_tamper
domain: healthcare
time_of_day: "23:55"
default_class: malicious
rule_engine_relationship: malicious_false_negative
sessions:
  - session_label: billing_tamper
    role: billing_clerk
    anchor: db
    timing:
      tempo: steady
      step_gaps_seconds: [2.5]
    events:
      - step_id: zero_out
        sql: "UPDATE billing SET amount = 0, payment_status = 'waived' WHERE invoice_id IN (SELECT invoice_id FROM billing WHERE payment_status = 'pending' AND amount > 5000)"
      - step_id: compress_evidence
        process: {comm: gzip, args: ["-f", "/tmp/billing_export.csv"], parent: zero_out}
      - step_id: remove_export
        file: {path: "/tmp/billing_export.csv.gz", syscall: unlink, parent: compress_evidence}
