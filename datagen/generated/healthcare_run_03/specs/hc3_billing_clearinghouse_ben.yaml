scenario_id: hc3_billing_clearinghouse_ben
family_id: healthcare_billing_clearinghouse
domain: healthcare
time_of_day: "01:15"
default_class: benign
rule_engine_relationship: benign_false_positive
sessions:
  - session_label: claims_batch
    role: billing_clerk
    anchor: db
    timing:
      tempo: steady
      step_gaps_seconds: [5.0]
    events:
      - step_id: dump_claims
        sql: "COPY (SELECT patient_id, insurance_id, amount FROM billing WHERE payment_status = 'pending') TO PROGRAM 'curl -sX POST https://claims.clearinghouse-partner.example.net/submit -d @-'"
        connects_to: {ip: "203.0.113.77", port: 443}
