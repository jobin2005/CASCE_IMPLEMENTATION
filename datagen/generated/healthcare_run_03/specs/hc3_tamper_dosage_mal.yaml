scenario_id: hc3_tamper_dosage_mal
family_id: healthcare_prescription_tamper
domain: healthcare
time_of_day: "03:45"
default_class: malicious
rule_engine_relationship: malicious_false_negative
sessions:
  - session_label: dosage_tamper
    role: nurse
    anchor: db
    timing:
      tempo: steady
      step_gaps_seconds: [2.0]
    events:
      - step_id: bulk_update
        sql: "UPDATE prescriptions SET dosage = '1000mg' WHERE drug_name = 'oxycodone' AND issued_at > '2026-09-01 00:00:00'"
      - step_id: clear_trace
        process: {comm: bash, args: ["-c", "history -c"], parent: bulk_update}
      - step_id: remove_shell_log
        file: {path: "/home/nurse_svc/.bash_history", syscall: unlink, parent: clear_trace}
