scenario_id: hc3_pivot_internal_him_mal
family_id: healthcare_lateral_pivot_him
domain: healthcare
time_of_day: "03:35"
default_class: malicious
rule_engine_relationship: malicious_false_negative
sessions:
  - session_label: enterprise_probe
    role: him_officer
    anchor: db
    timing:
      tempo: steady
      step_gaps_seconds: [3.0]
    events:
      - step_id: bulk_read
        sql: "SELECT patient_id, ssn, date_of_birth, address, phone FROM patients"
  - session_label: internal_pivot
    role: him_officer
    anchor: synthetic
    anchor_query: "SELECT 1"
    delay_after_previous_seconds: 8
    timing:
      tempo: bursty
      step_gaps_seconds: [0.5]
    events:
      - step_id: spawn_shell
        process: {comm: bash, args: ["-i"]}
      - step_id: beacon_internal
        connect: {ip: "10.77.4.9", port: 4444, parent: spawn_shell}
