scenario_id: hc3_union_census_ben
family_id: healthcare_enterprise_census_union
domain: healthcare
time_of_day: "10:15"
default_class: benign
rule_engine_relationship: benign_false_positive
sessions:
  - session_label: census_report
    role: him_officer
    anchor: db
    timing:
      tempo: steady
      step_gaps_seconds: [3.0]
    events:
      - step_id: dept_counts
        sql: "SELECT department_id, count(*) AS total FROM doctors WHERE department_id = 'D-02' GROUP BY department_id UNION SELECT department_id, count(*) AS total FROM doctors WHERE department_id = 'D-07' GROUP BY department_id"
      - step_id: write_report
        process: {comm: python3, args: ["/opt/him/enterprise_census.py", "--depts", "D-02,D-07", "--out", "/var/reports/census_2026Q3.csv"], parent: dept_counts}
      - file: {path: "/var/reports/census_2026Q3.csv", syscall: openat, parent: write_report}
