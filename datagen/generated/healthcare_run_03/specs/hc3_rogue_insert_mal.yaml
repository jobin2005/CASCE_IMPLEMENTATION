scenario_id: hc3_rogue_insert_mal
family_id: healthcare_rogue_insert
domain: healthcare
time_of_day: "22:05"
default_class: malicious
rule_engine_relationship: agrees
sessions:
  - session_label: rogue_prescription
    role: physician
    anchor: db
    timing:
      tempo: steady
      step_gaps_seconds: [2.0]
    events:
      - step_id: lookup_outside_panel
        sql: "SELECT patient_id, full_name FROM patients WHERE patient_id = 60318"
      - step_id: insert_fraud_rx
        sql: "INSERT INTO prescriptions (patient_id, doctor_id, drug_name, dosage, issued_at) VALUES (60318, 219, 'oxycodone', '80mg', now())"
      - step_id: print_label
        process: {comm: lp, args: ["-d", "pharmacy_printer", "/tmp/rx_60318.pdf"], parent: insert_fraud_rx}
      - step_id: cleanup
        file: {path: "/tmp/rx_60318.pdf", syscall: unlink, parent: print_label}
