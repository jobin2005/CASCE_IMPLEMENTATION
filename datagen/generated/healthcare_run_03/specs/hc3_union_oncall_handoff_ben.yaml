scenario_id: hc3_union_oncall_handoff_ben
family_id: healthcare_oncall_handoff_union
domain: healthcare
time_of_day: "23:40"
default_class: benign
rule_engine_relationship: benign_false_positive
sessions:
  - session_label: shift_handoff
    role: physician
    anchor: db
    timing:
      tempo: steady
      step_gaps_seconds: [3.5]
    events:
      - step_id: panel_union
        sql: "SELECT patient_id, full_name, appointment_time FROM appointments a JOIN patients USING (patient_id) WHERE a.doctor_id = 118 AND a.status = 'scheduled' UNION SELECT patient_id, full_name, appointment_time FROM appointments a JOIN patients USING (patient_id) WHERE a.doctor_id = 142 AND a.status = 'scheduled'"
      - step_id: write_handoff
        process: {comm: bash, args: ["-c", "cat /tmp/handoff_draft.txt >> /var/log/oncall/handoff_2026-09-21.log"], parent: panel_union}
      - file: {path: "/var/log/oncall/handoff_2026-09-21.log", syscall: openat, parent: write_handoff}
