scenario_id: hc3_him_audit_ssn_ben
family_id: healthcare_him_sensitive_audit
domain: healthcare
time_of_day: "03:20"
default_class: benign
rule_engine_relationship: benign_false_positive
sessions:
  - session_label: quarterly_phi_audit
    role: him_officer
    anchor: db
    timing:
      tempo: steady
      step_gaps_seconds: [5.0]
    events:
      - step_id: scope_check
        sql: "SELECT doctor_id, department_id FROM doctors WHERE department_id = 'D-05'"
      - step_id: query_patients
        sql: "SELECT patient_id, ssn, date_of_birth, address FROM patients WHERE primary_doctor_id IN (SELECT doctor_id FROM doctors WHERE department_id = 'D-05')"
      - step_id: write_log
        process: {comm: audit_logger, args: ["--write", "/var/log/him_audit/2026-09-21_D-05_phi.log"], parent: query_patients}
      - file: {path: "/var/log/him_audit/2026-09-21_D-05_phi.log", syscall: openat, parent: write_log}
