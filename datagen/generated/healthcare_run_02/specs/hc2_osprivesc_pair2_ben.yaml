sessions:
  - session_label: escalate
    role: postgres
    anchor: synthetic
    anchor_query: "SELECT 1"
    timing:
      tempo: bursty
      step_gaps_seconds: [1.0]
    events:
      - step_id: copy_script2
        process: {comm: cp, args: ["/usr/local/bin/pg_archive_cleanup.py", "/tmp/pg_archive_cleanup.py"]}
