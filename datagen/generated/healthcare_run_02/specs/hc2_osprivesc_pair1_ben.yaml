scenario_id: hc2_osprivesc_pair1_ben
family_id: healthcare_osprivesc_maint_chain
domain: healthcare
matched_pair_id: healthcare_osprivesc_pair1
matched_dimensions:
  fixed: [syscall_sequence, timing_pattern, role]
  varied: [process_tree_shape]
time_of_day: "22:05"
default_class: benign
rule_engine_relationship: benign_false_positive
sessions:
  - session_label: escalate
    role: postgres
    anchor: synthetic
    anchor_query: "SELECT 1"
    timing:
      tempo: bursty
      step_gaps_seconds: [1.0]
    events:
      - step_id: copy_script
        process: {comm: cp, args: ["/usr/local/bin/pg_stats_refresh.sh", "/tmp/pg_stats_refresh.sh"]}
      - step_id: set_exec
        process: {comm: chmod, args: ["u+x", "/tmp/pg_stats_refresh.sh"], parent: copy_script}
      - step_id: run_maint
        process: {comm: /tmp/pg_stats_refresh.sh, args: ["--refresh-stats"], parent: set_exec}
