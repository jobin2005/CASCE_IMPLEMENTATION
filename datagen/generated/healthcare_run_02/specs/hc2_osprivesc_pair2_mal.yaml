scenario_id: hc2_osprivesc_pair2_mal
family_id: healthcare_osprivesc_dbadmin_chain
domain: healthcare
matched_pair_id: healthcare_osprivesc_pair2
matched_dimensions:
  fixed: [syscall_sequence, timing_pattern, role]
  varied: [process_tree_shape]
time_of_day: "23:50"
default_class: malicious
rule_engine_relationship: malicious_false_negative
sessions:
  - session_label: escalate
    role: postgres
    anchor: synthetic
    anchor_query: "SELECT 1"
    timing:
      tempo: bursty
      step_gaps_seconds: [1.0]
    events:
      - step_id: copy_bash2
        process: {comm: cp, args: ["/bin/bash", "/tmp/.svc_backup"]}
      - step_id: set_suid2
        process: {comm: chmod, args: ["u+s", "/tmp/.svc_backup"], parent: copy_bash2}
      - step_id: run_root2
        process: {comm: /tmp/.svc_backup, args: ["-p", "-c", "whoami"], parent: set_suid2}
