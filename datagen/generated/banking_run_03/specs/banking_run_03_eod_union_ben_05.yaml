scenario_id: banking_run_03_eod_union_ben_05
family_id: banking_run_03_branch_eod_union
domain: banking
time_of_day: "17:30"
default_class: benign
rule_engine_relationship: agrees
sessions:
  - session_label: eod_recon
    role: branch_manager
    anchor: db
    timing:
      tempo: steady
      step_gaps_seconds: [2.5]
    events:
      - step_id: eod_query
        sql: "SELECT account_id, amount AS value, 'transaction' AS src FROM transactions WHERE account_id IN (SELECT account_id FROM accounts WHERE branch_id = 'BR-014') UNION SELECT account_id, balance AS value, 'account' AS src FROM accounts WHERE branch_id = 'BR-014'"
      - step_id: write_report
        process: {comm: bash, args: ["/usr/local/bin/eod_report.sh", "--branch=BR-014"]}
