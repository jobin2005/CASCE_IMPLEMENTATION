scenario_id: healthcare_nurse_routine_0020
family_id: healthcare_nurse_routine_0020
domain: healthcare
time_of_day: '12:15'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: nurse_work
  role: nurse
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.4087847538914096
  events:
  - sql: SELECT patient_id, full_name FROM patients WHERE primary_doctor_id = 420
  - sql: SELECT patient_id, full_name FROM patients WHERE primary_doctor_id = 420
  - sql: SELECT patient_id, full_name, phone FROM patients WHERE primary_doctor_id IN (SELECT doctor_id FROM doctors WHERE department_id = 'DEPT-PSYCH') AND patient_id = 85857
  - sql: SELECT a.appointment_id, p.full_name, a.reason FROM appointments a JOIN patients p ON p.patient_id = a.patient_id WHERE a.doctor_id = 269 AND a.appointment_time > NOW() - INTERVAL '1 day' ORDER
      BY a.appointment_time
  - sql: SELECT p.prescription_id, p.drug_name, p.dosage FROM prescriptions p WHERE p.patient_id = 21758 ORDER BY p.issued_at DESC LIMIT 5
  - step_id: daily_report
    sql: COPY (SELECT a.appointment_id, a.patient_id, a.status FROM appointments a WHERE a.doctor_id IN (SELECT doctor_id FROM doctors WHERE department_id = 'DEPT-ORTHO') AND a.appointment_time > NOW()
      - INTERVAL '1 day') TO PROGRAM 'cat > /var/lib/postgresql/reports/dept_DEPT-ORTHO_daily.csv'
