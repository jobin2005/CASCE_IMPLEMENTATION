rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: physician
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.5802936216224452
  events:
  - sql: SELECT p.patient_id, p.full_name, m.diagnosis_code, m.recorded_at FROM patients p JOIN medical_records m ON m.patient_id = p.patient_id WHERE m.doctor_id = 325 ORDER BY m.recorded_at DESC
  - sql: SELECT a.appointment_id, p.full_name, a.reason FROM appointments a JOIN patients p ON p.patient_id = a.patient_id WHERE a.doctor_id = 325 AND a.status = 'scheduled' ORDER BY a.appointment_time
  - sql: INSERT INTO prescriptions (patient_id, doctor_id, drug_name, dosage, issued_at) VALUES (16036, 325, 'Amoxicillin', '500mg TID x 10 days', NOW())
  - sql: SELECT p.full_name, pr.drug_name, pr.dosage FROM patients p JOIN prescriptions pr ON pr.patient_id = p.patient_id WHERE pr.doctor_id = 325 AND pr.issued_at > NOW() - INTERVAL '30 days'
  - step_id: eod_report
    sql: COPY (SELECT a.appointment_id, p.full_name, a.reason FROM appointments a JOIN patients p ON p.patient_id = a.patient_id WHERE a.doctor_id IN (SELECT doctor_id FROM doctors WHERE department_id =
      'DEPT-ORTHO') AND a.appointment_time > NOW() - INTERVAL '1 day') TO PROGRAM 'cat > /var/lib/postgresql/reports/dept_DEPT-ORTHO_daily.csv'
