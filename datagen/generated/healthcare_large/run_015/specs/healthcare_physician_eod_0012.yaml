scenario_id: healthcare_physician_eod_0012
family_id: healthcare_physician_eod_0012
domain: healthcare
time_of_day: '16:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: eod
  role: physician
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 4.378864296556049
  events:
  - sql: SELECT COUNT(*) FROM appointments WHERE doctor_id = 171 AND status = 'completed' AND appointment_time > NOW() - INTERVAL '7 days'
  - sql: SELECT p.full_name, pr.drug_name, pr.dosage FROM patients p JOIN prescriptions pr ON pr.patient_id = p.patient_id WHERE pr.doctor_id = 171 AND pr.issued_at > NOW() - INTERVAL '30 days'
  - step_id: eod_report
    sql: COPY (SELECT a.appointment_id, p.full_name, a.reason FROM appointments a JOIN patients p ON p.patient_id = a.patient_id WHERE a.doctor_id IN (SELECT doctor_id FROM doctors WHERE department_id =
      'DEPT-ICU') AND a.appointment_time > NOW() - INTERVAL '1 day') TO PROGRAM 'cat > /var/lib/postgresql/reports/dept_DEPT-ICU_daily.csv'
