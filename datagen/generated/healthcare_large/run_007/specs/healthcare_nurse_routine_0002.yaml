scenario_id: healthcare_nurse_routine_0002
family_id: healthcare_nurse_routine_0002
domain: healthcare
time_of_day: '11:30'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: nurse_work
  role: nurse
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.983734780507668
  events:
  - sql: SELECT a.appointment_id, p.full_name, a.reason FROM appointments a JOIN patients p ON p.patient_id = a.patient_id WHERE a.doctor_id = 318 AND a.appointment_time > NOW() - INTERVAL '1 day' ORDER
      BY a.appointment_time
  - sql: SELECT patient_id, full_name, phone FROM patients WHERE primary_doctor_id IN (SELECT doctor_id FROM doctors WHERE department_id = 'DEPT-EMERG') AND patient_id = 67351
  - sql: UPDATE appointments SET status = 'checked_in' WHERE appointment_id = 96266 AND patient_id = 30079
  - step_id: daily_report
    sql: COPY (SELECT a.appointment_id, a.patient_id, a.status FROM appointments a WHERE a.doctor_id IN (SELECT doctor_id FROM doctors WHERE department_id = 'DEPT-CARDIO') AND a.appointment_time > NOW()
      - INTERVAL '1 day') TO PROGRAM 'cat > /var/lib/postgresql/reports/dept_DEPT-CARDIO_daily.csv'
