default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: nurse_work
  role: nurse
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.9557549993459484
  events:
  - sql: SELECT COUNT(*) FROM appointments WHERE doctor_id = 270 AND status = 'scheduled' AND appointment_time > NOW()
  - sql: UPDATE appointments SET status = 'checked_in' WHERE appointment_id = 53058 AND patient_id = 48965
