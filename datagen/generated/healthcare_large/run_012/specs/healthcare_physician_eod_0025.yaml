  - sql: INSERT INTO medical_records (patient_id, doctor_id, diagnosis_code, diagnosis_notes, recorded_at) VALUES (94630, 243, 'J06.9', 'Upper respiratory infection, prescribed amoxicillin', NOW())
  - sql: SELECT a.appointment_id, p.full_name, a.reason FROM appointments a JOIN patients p ON p.patient_id = a.patient_id WHERE a.doctor_id = 243 AND a.status = 'scheduled' ORDER BY a.appointment_time
