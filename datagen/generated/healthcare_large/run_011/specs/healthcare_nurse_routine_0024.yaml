scenario_id: healthcare_nurse_routine_0024
family_id: healthcare_nurse_routine_0024
domain: healthcare
time_of_day: '14:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: nurse_work
  role: nurse
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.449071451252242
  events:
  - sql: SELECT p.prescription_id, p.drug_name, p.dosage FROM prescriptions p WHERE p.patient_id = 18041 ORDER BY p.issued_at DESC LIMIT 5
  - sql: UPDATE patients SET phone = '555-5094' WHERE patient_id = 82010
  - step_id: daily_report
    sql: COPY (SELECT a.appointment_id, a.patient_id, a.status FROM appointments a WHERE a.doctor_id IN (SELECT doctor_id FROM doctors WHERE department_id = 'DEPT-ONCOL') AND a.appointment_time > NOW()
      - INTERVAL '1 day') TO PROGRAM 'cat > /var/lib/postgresql/reports/dept_DEPT-ONCOL_daily.csv'
