scenario_id: healthcare_nurse_routine_0019
family_id: healthcare_nurse_routine_0019
domain: healthcare
time_of_day: '10:15'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: nurse_work
  role: nurse
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 3.3427994568932204
  events:
  - sql: SELECT patient_id, full_name FROM patients WHERE primary_doctor_id = 441
  - sql: SELECT a.appointment_id, a.reason, a.appointment_time FROM appointments a WHERE a.patient_id = 51100 AND a.status = 'scheduled' ORDER BY a.appointment_time
  - step_id: daily_report
    sql: COPY (SELECT a.appointment_id, a.patient_id, a.status FROM appointments a WHERE a.doctor_id IN (SELECT doctor_id FROM doctors WHERE department_id = 'DEPT-RADIO') AND a.appointment_time > NOW()
      - INTERVAL '1 day') TO PROGRAM 'cat > /var/lib/postgresql/reports/dept_DEPT-RADIO_daily.csv'
