  - sql: SELECT d.department_id, d.specialty, COUNT(a.appointment_id) FROM doctors d JOIN appointments a ON a.doctor_id = d.doctor_id WHERE d.department_id = 'DEPT-CARDIO' AND a.appointment_time > '2026-04-04
