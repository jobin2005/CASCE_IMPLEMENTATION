scenario_id: healthcare_nurse_routine_0005
family_id: healthcare_nurse_routine_0005
domain: healthcare
time_of_day: '14:30'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: nurse_work
  role: nurse
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 2.690203755826568
  events:
  - sql: SELECT COUNT(*) FROM appointments WHERE doctor_id = 386 AND status = 'scheduled' AND appointment_time > NOW()
  - sql: SELECT a.appointment_id, a.reason, a.appointment_time FROM appointments a WHERE a.patient_id = 73261 AND a.status = 'scheduled' ORDER BY a.appointment_time
  - step_id: daily_report
    sql: COPY (SELECT a.appointment_id, a.patient_id, a.status FROM appointments a WHERE a.doctor_id IN (SELECT doctor_id FROM doctors WHERE department_id = 'DEPT-PEDS') AND a.appointment_time > NOW() -
      INTERVAL '1 day') TO PROGRAM 'cat > /var/lib/postgresql/reports/dept_DEPT-PEDS_daily.csv'
