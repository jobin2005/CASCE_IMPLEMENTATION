scenario_id: healthcare_nurse_routine_0009
family_id: healthcare_nurse_routine_0009
domain: healthcare
time_of_day: '10:00'
default_class: benign
rule_engine_relationship: agrees
sessions:
- session_label: nurse_work
  role: nurse
  class: benign
  anchor: db
  timing:
    tempo: steady
    step_gaps_seconds:
    - 1.7323824300940274
  events:
  - sql: SELECT COUNT(*) FROM appointments WHERE doctor_id = 486 AND status = 'scheduled' AND appointment_time > NOW()
  - sql: UPDATE patients SET phone = '555-9721' WHERE patient_id = 75288
  - sql: SELECT a.appointment_id, p.full_name, a.reason FROM appointments a JOIN patients p ON p.patient_id = a.patient_id WHERE a.doctor_id = 232 AND a.appointment_time > NOW() - INTERVAL '1 day' ORDER
      BY a.appointment_time
  - step_id: daily_report
    sql: COPY (SELECT a.appointment_id, a.patient_id, a.status FROM appointments a WHERE a.doctor_id IN (SELECT doctor_id FROM doctors WHERE department_id = 'DEPT-CARDIO') AND a.appointment_time > NOW()
      - INTERVAL '1 day') TO PROGRAM 'cat > /var/lib/postgresql/reports/dept_DEPT-CARDIO_daily.csv'
