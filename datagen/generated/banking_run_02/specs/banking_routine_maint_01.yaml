scenario_id: banking_routine_maint_01
family_id: banking_routine_nightly_maintenance_01
domain: banking
time_of_day: "23:30"
default_class: benign
rule_engine_relationship: agrees
sessions:
  - session_label: nightly_vacuum
    role: postgres
    anchor: synthetic
    anchor_query: "SELECT 1"
    timing:
      tempo: steady
      step_gaps_seconds: [2.0]
    events:
      - step_id: run_cron
        process: {comm: sh, args: ["/etc/cron.daily/pg_nightly_maintenance"]}
      - step_id: vacuum
        process: {comm: vacuumdb, args: ["--all", "--analyze"], parent: run_cron}
      - step_id: write_log
        file: {path: "/var/log/postgresql/maintenance.log", syscall: openat, parent: vacuum}
