scenario_id: banking_osprivesc_ben_02
family_id: banking_os_priv_escalation_02
domain: banking
matched_pair_id: banking_osprivesc_pair_02
matched_dimensions:
  fixed: [syscall_sequence, timing_pattern, role]
  varied: [process_tree_shape]
time_of_day: "22:45"
default_class: benign
rule_engine_relationship: agrees
sessions:
  - session_label: escalate
    role: postgres
    anchor: synthetic
    anchor_query: "SELECT 1"
    timing:
      tempo: bursty
      step_gaps_seconds: [0.8]
    events:
      - step_id: copy_script
        process: {comm: cp, args: ["/usr/local/bin/pg_backup_verify.sh", "/tmp/pg_backup_verify.sh"]}
      - step_id: set_exec
        process: {comm: chmod, args: ["u+x", "/tmp/pg_backup_verify.sh"], parent: copy_script}
      - step_id: run_check
        process: {comm: /tmp/pg_backup_verify.sh, args: ["--check"], parent: set_exec}
