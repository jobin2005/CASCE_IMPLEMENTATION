scenario_id: logistics_routine_dispatcher_manifest_01
family_id: logistics_routine_dispatcher_manifest
domain: logistics
time_of_day: "09:40"
default_class: benign
rule_engine_relationship: agrees
sessions:
  - session_label: dispatch
    role: dispatcher
    anchor: db
    timing:
      tempo: steady
      step_gaps_seconds: [2.5]
    events:
      - step_id: assign_query
        sql: "SELECT s.shipment_id, s.driver_id, s.vehicle_id, s.status FROM shipments s JOIN drivers d ON s.driver_id = d.driver_id WHERE d.depot_id = 'DP-05' AND s.status = 'ready'"
      - step_id: assign_update
        sql: "UPDATE shipments SET driver_id = 63417, status = 'assigned' WHERE shipment_id = 61050"
      - step_id: print_manifest
        process: {comm: lp, args: ["-d", "depot5_printer", "dispatch_manifest_61050.txt"], parent: assign_update}
