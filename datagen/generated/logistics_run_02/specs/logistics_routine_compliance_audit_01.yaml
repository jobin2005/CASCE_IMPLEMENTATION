scenario_id: logistics_routine_compliance_audit_01
family_id: logistics_routine_compliance_audit
domain: logistics
time_of_day: "05:45"
default_class: benign
rule_engine_relationship: agrees
sessions:
  - session_label: audit
    role: compliance_auditor
    anchor: db
    timing:
      tempo: off_hours
      step_gaps_seconds: [3.0]
    events:
      - step_id: read_pii
        sql: "SELECT driver_id, license_number, phone, home_address FROM drivers WHERE depot_id = 'DP-05'"
      - step_id: write_log
        process: {comm: tee, args: ["-a", "/var/log/compliance/audit_dp05.log"], parent: read_pii}
      - step_id: log_write
        file: {path: "/var/log/compliance/audit_dp05.log", syscall: openat, parent: write_log}
