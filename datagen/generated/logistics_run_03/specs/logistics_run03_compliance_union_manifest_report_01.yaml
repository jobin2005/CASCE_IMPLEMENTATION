# Leak 2 (sql-verb): legitimate UNION by compliance_auditor combining
# shipment status across two origin warehouses for a scheduled cross-depot
# audit report, archived to the internal compliance log.
scenario_id: logistics_run03_compliance_union_manifest_report_01
family_id: logistics_run03_compliance_union_report
domain: logistics
time_of_day: "05:50"
default_class: benign
rule_engine_relationship: benign_false_positive
sessions:
  - session_label: cross_depot_report
    role: compliance_auditor
    anchor: db
    timing:
      tempo: off_hours
      step_gaps_seconds: [3.0]
    events:
      - step_id: union_query
        sql: "SELECT shipment_id, status FROM shipments WHERE origin_warehouse_id = 1 UNION SELECT shipment_id, status FROM shipments WHERE origin_warehouse_id = 2"
      - step_id: archive_report
        process: {comm: bash, args: ["/opt/compliance/archive_manifest_report.sh"], parent: union_query}
      - step_id: report_write
        file: {path: "/var/log/compliance/manifest_status_report.csv", syscall: openat, parent: archive_report}
