# Leak 3 (endpoint): legitimate partner_etl_service nightly sync to the
# documented EXTERNAL customs gateway -- external destination alone must
# not be a malicious tell.
scenario_id: logistics_run03_partner_etl_customs_gateway_sync_01
family_id: logistics_run03_partner_etl_external_sync
domain: logistics
time_of_day: "22:05"
default_class: benign
rule_engine_relationship: benign_false_positive
sessions:
  - session_label: nightly_sync
    role: partner_etl_service
    anchor: db
    timing:
      tempo: off_hours
      step_gaps_seconds: [5.0]
    events:
      - step_id: dump
        sql: "COPY (SELECT shipment_id, status, dispatched_at FROM shipments WHERE dispatched_at > '2026-09-20 22:00:00') TO PROGRAM 'curl -s https://customs-gateway.example/ingest -d @- > /tmp/etl_sync_11.log'"
        connects_to: {ip: "203.0.113.10", port: 443}
