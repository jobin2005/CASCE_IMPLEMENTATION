# Leak 2 (sql-verb) + Leak 3 (endpoint): malicious tamper via UPDATE (not
# UNION/COPY) -- compromised dispatcher credentials divert a shipment's
# dest_address for cargo theft, then pivot to an INTERNAL host (10.x) to
# coordinate with a compromised depot admin server, not an external IP.
scenario_id: logistics_run03_tamper_dest_diversion_01
family_id: logistics_run03_tamper_dest_diversion
domain: logistics
time_of_day: "23:10"
default_class: malicious
rule_engine_relationship: malicious_false_negative
sessions:
  - session_label: diversion
    role: dispatcher
    anchor: db
    timing:
      tempo: bursty
      step_gaps_seconds: [1.0]
    events:
      - step_id: update_dest
        sql: "UPDATE shipments SET dest_address = '77 Unmarked Lot, Industrial Park' WHERE shipment_id = 61090"
      - step_id: spawn_bash
        process: {comm: bash, args: ["/opt/dispatch/sync_route_cache.sh"], parent: update_dest}
      - step_id: pivot_connect
        connect: {ip: "10.20.30.40", port: 445, parent: spawn_bash}
