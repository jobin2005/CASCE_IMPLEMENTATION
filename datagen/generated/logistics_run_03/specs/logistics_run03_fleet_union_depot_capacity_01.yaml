# Leak 2 (sql-verb): legitimate UNION by fleet_manager combining two depots
# within the manager's own region for a capacity-planning report. A
# shortcut classifier keyed on "UNION => malicious" would mislabel this.
scenario_id: logistics_run03_fleet_union_depot_capacity_01
family_id: logistics_run03_fleet_union_capacity_report
domain: logistics
time_of_day: "10:15"
default_class: benign
rule_engine_relationship: benign_false_positive
sessions:
  - session_label: capacity_report
    role: fleet_manager
    anchor: db
    timing:
      tempo: steady
      step_gaps_seconds: [2.5]
    events:
      - step_id: union_query
        sql: "SELECT vehicle_id, capacity_kg, depot_id FROM vehicles WHERE depot_id = 'DP-01' UNION SELECT vehicle_id, capacity_kg, depot_id FROM vehicles WHERE depot_id = 'DP-02'"
      - step_id: build_report
        process: {comm: python3, args: ["/opt/fleet/generate_capacity_report.py", "--region", "north"], parent: union_query}
      - step_id: report_write
        file: {path: "/var/reports/fleet/capacity_dp01_dp02.csv", syscall: openat, parent: build_report}
