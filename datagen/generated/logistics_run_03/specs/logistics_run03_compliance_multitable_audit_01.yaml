# Leak 1 (sensitive-table): compliance_auditor cross-depot join across
# drivers/shipments/manifests sensitive columns for a quarterly regulatory
# audit; consolidated report is pushed to the INTERNAL audit endpoint.
scenario_id: logistics_run03_compliance_multitable_audit_01
family_id: logistics_run03_compliance_sensitive_audit
domain: logistics
time_of_day: "05:30"
default_class: benign
rule_engine_relationship: agrees
sessions:
  - session_label: audit
    role: compliance_auditor
    anchor: db
    timing:
      tempo: off_hours
      step_gaps_seconds: [4.0]
    events:
      - step_id: read_joined
        sql: "SELECT d.license_number, d.home_address, s.dest_address, m.declared_value FROM drivers d JOIN shipments s ON d.driver_id = s.driver_id JOIN manifests m ON m.shipment_id = s.shipment_id WHERE s.dispatched_at > '2026-09-01 00:00:00'"
      - step_id: build_report
        process: {comm: bash, args: ["/opt/compliance/build_quarterly_report.sh"], parent: read_joined}
      - step_id: report_write
        file: {path: "/var/log/compliance/quarterly_audit_q3.csv", syscall: openat, parent: build_report}
      - step_id: push_internal
        process: {comm: bash, args: ["/opt/compliance/push_to_audit_store.sh", "--source", "quarterly_report"], parent: report_write}
      - step_id: audit_store_connect
        connect: {ip: "10.10.5.20", port: 8443, parent: push_internal}
