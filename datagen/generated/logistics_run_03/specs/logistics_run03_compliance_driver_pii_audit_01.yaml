# Leak 1 (sensitive-table): compliance_auditor reads drivers PII
# (license_number, phone, home_address) for a scheduled depot audit and
# writes the result to an INTERNAL audit log -- not an exfil channel.
scenario_id: logistics_run03_compliance_driver_pii_audit_01
family_id: logistics_run03_compliance_sensitive_audit
domain: logistics
time_of_day: "04:10"
default_class: benign
rule_engine_relationship: benign_false_positive
sessions:
  - session_label: audit
    role: compliance_auditor
    anchor: db
    timing:
      tempo: off_hours
      step_gaps_seconds: [3.0]
    events:
      - step_id: read_pii
        sql: "SELECT driver_id, full_name, license_number, phone, home_address FROM drivers WHERE depot_id = 'DP-02'"
      - step_id: write_log
        process: {comm: python3, args: ["/opt/compliance/write_audit_log.py", "--depot", "DP-02", "--table", "drivers"], parent: read_pii}
      - step_id: log_write
        file: {path: "/var/log/compliance/audit_dp02_drivers.jsonl", syscall: openat, parent: write_log}
