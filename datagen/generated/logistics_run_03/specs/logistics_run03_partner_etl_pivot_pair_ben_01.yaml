# Leak 3 (endpoint), matched pair (benign half): partner_etl_service's
# routine off-hours sync to the documented EXTERNAL customs gateway.
# Twinned with the malicious half below, whose compromised instance of the
# same role/timing pivots to an INTERNAL 10.x host instead -- the tell is
# query breadth/sensitive-column selection and destination, not the role.
scenario_id: logistics_run03_partner_etl_pivot_pair_ben_01
family_id: logistics_run03_partner_etl_pivot_pair
domain: logistics
matched_pair_id: logistics_run_03_partner_pivot_01
matched_dimensions:
  fixed: [process_tree_shape, syscall_sequence, timing_pattern, role]
  varied: [sql_content, connects_to_destination]
time_of_day: "22:45"
default_class: benign
rule_engine_relationship: benign_false_positive
sessions:
  - session_label: sync
    role: partner_etl_service
    anchor: db
    timing:
      tempo: off_hours
      step_gaps_seconds: [5.0]
    events:
      - step_id: dump
        sql: "COPY (SELECT shipment_id, status, dispatched_at FROM shipments WHERE dispatched_at > '2026-09-20 23:00:00') TO PROGRAM 'curl -s https://customs-gateway.example/sync -d @- > /tmp/etl_pivot.log'"
        connects_to: {ip: "203.0.113.55", port: 443}
