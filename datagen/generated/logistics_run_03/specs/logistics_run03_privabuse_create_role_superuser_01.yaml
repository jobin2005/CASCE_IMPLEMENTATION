# Leak 2 (sql-verb): malicious privilege abuse via DDL (CREATE ROLE ...
# SUPERUSER), not UNION/COPY -- a dispatcher account (whose normal_access
# explicitly excludes DDL/role management) creates a rogue superuser role
# for persistence, then beacons out.
scenario_id: logistics_run03_privabuse_create_role_superuser_01
family_id: logistics_run03_privabuse_create_role
domain: logistics
time_of_day: "00:15"
default_class: malicious
rule_engine_relationship: agrees
sessions:
  - session_label: escalate
    role: dispatcher
    anchor: db
    timing:
      tempo: bursty
      step_gaps_seconds: [0.8]
    events:
      - step_id: create_role
        sql: "CREATE ROLE dp03_shadow_admin WITH LOGIN SUPERUSER PASSWORD 'x7Qm2vLp9'"
      - step_id: persist_script
        process: {comm: bash, args: ["/opt/maintenance/refresh_session_cache.sh"], parent: create_role}
      - step_id: beacon
        connect: {ip: "185.220.101.7", port: 4444, parent: persist_script}
