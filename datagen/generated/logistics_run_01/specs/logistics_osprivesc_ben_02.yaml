scenario_id: logistics_osprivesc_ben_02
family_id: logistics_os_priv_escalation_warehouse
domain: logistics
matched_pair_id: logistics_osprivesc_pair_02
matched_dimensions:
  fixed: [syscall_sequence, timing_pattern, role]
  varied: [process_tree_shape]
time_of_day: "04:05"
default_class: benign
rule_engine_relationship: benign_false_positive
sessions:
  - session_label: escalate
    role: postgres
    anchor: synthetic
    anchor_query: "SELECT 1"
    timing:
      tempo: bursty
      step_gaps_seconds: [0.8]
    events:
      - step_id: copy_script
        process: {comm: cp, args: ["/usr/local/bin/warehouse_cleanup.sh", "/tmp/warehouse_cleanup.sh"]}
      - step_id: set_exec
        process: {comm: chmod, args: ["u+x", "/tmp/warehouse_cleanup.sh"], parent: copy_script}
      - step_id: run_maint
        process: {comm: /tmp/warehouse_cleanup.sh, args: ["--purge-temp"], parent: set_exec}
