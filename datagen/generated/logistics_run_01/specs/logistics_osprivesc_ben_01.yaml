scenario_id: logistics_osprivesc_ben_01
family_id: logistics_os_priv_escalation_depot
domain: logistics
matched_pair_id: logistics_osprivesc_pair_01
matched_dimensions:
  fixed: [syscall_sequence, timing_pattern, role]
  varied: [process_tree_shape]
time_of_day: "02:55"
default_class: benign
rule_engine_relationship: benign_false_positive
sessions:
  - session_label: escalate
    role: postgres
    anchor: synthetic
    anchor_query: "SELECT 1"
    timing:
      tempo: bursty
      step_gaps_seconds: [1.0]
    events:
      - step_id: copy_script
        process: {comm: cp, args: ["/usr/local/bin/depot_maintenance.sh", "/tmp/depot_maintenance.sh"]}
      - step_id: set_exec
        process: {comm: chmod, args: ["u+x", "/tmp/depot_maintenance.sh"], parent: copy_script}
      - step_id: run_maint
        process: {comm: /tmp/depot_maintenance.sh, args: ["--sync-manifests"], parent: set_exec}
