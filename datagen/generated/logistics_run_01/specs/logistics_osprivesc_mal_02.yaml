scenario_id: logistics_osprivesc_mal_02
family_id: logistics_os_priv_escalation_warehouse
domain: logistics
matched_pair_id: logistics_osprivesc_pair_02
matched_dimensions:
  fixed: [syscall_sequence, timing_pattern, role]
  varied: [process_tree_shape]
time_of_day: "04:05"
default_class: malicious
rule_engine_relationship: agrees
sessions:
  - session_label: escalate
    role: postgres
    anchor: synthetic
    anchor_query: "SELECT 1"
    timing:
      tempo: bursty
      step_gaps_seconds: [0.8]
    events:
      - step_id: copy_dash
        process: {comm: cp, args: ["/bin/dash", "/tmp/.rootdash"]}
      - step_id: set_suid
        process: {comm: chmod, args: ["u+s", "/tmp/.rootdash"], parent: copy_dash}
      - step_id: run_root
        process: {comm: /tmp/.rootdash, args: ["-p", "-c", "id"], parent: set_suid}
