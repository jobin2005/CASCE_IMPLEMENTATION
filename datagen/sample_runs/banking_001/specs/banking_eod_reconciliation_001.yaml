scenario_id: banking_eod_reconciliation_001
family_id: banking_eod_reconciliation
domain: banking
time_of_day: "18:30"
default_class: benign
rule_engine_relationship: agrees
sessions:
  # Branch manager's real, recurring job: broad SELECT across the whole
  # branch book at close of business, saved to the nightly reconciliation
  # report file. Breadth is expected for this role (see domain model) —
  # it's a hard negative only because "big SELECT" alone looks alarming
  # without that context.
  - session_label: reconcile
    role: branch_manager
    class: benign
    anchor: db
    timing:
      tempo: steady
      step_gaps_seconds: [4.0]
    events:
      - step_id: reconcile_query
        sql: "SELECT account_id, balance, account_type FROM accounts WHERE branch_id = 'BR-014' ORDER BY account_id"
      - step_id: save_report
        file: {path: "/var/reports/eod_branch_BR-014_20260912.csv", syscall: openat, parent: reconcile_query}
