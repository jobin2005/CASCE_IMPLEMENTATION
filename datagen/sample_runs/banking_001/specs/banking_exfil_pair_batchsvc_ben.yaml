scenario_id: banking_exfil_pair_batchsvc_ben
family_id: banking_exfil_pair_batchsvc
domain: banking
matched_pair_id: banking_exfil_pair_batchsvc_01
matched_dimensions:
  fixed: [process_tree_shape, role]
  varied: [sql_content, connects_to_destination]
time_of_day: "02:15"
default_class: benign
rule_engine_relationship: benign_false_positive
sessions:
  # The documented nightly replication contract: scoped, non-sensitive
  # columns, incremental filter, to the one approved warehouse endpoint.
  # Same role and same COPY-TO-PROGRAM-via-curl mechanism as the malicious
  # twin, which is exactly why an existing rule template keyed on that
  # mechanism alone would trip on this legitimate job too.
  - session_label: exfil
    role: batch_etl_service
    class: benign
    anchor: db
    timing:
      tempo: steady
      step_gaps_seconds: [3.0]
    events:
      - step_id: exfil
        sql: "COPY (SELECT account_id, amount, transaction_id FROM transactions WHERE transaction_time > '2026-09-12 00:00:00' AND transaction_time <= '2026-09-13 00:00:00') TO PROGRAM 'curl -sX POST https://warehouse.internal.example/replicate -d @-'"
        connects_to: {ip: "198.51.100.20", port: 443}
